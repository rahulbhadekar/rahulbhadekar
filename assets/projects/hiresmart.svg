
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500"
     viewBox="0 0 1200 500">

  <title>HireSmart - AI Recruitment Platform</title>

  <defs>

    <radialGradient id="bg" cx="75%" cy="45%">
      <stop offset="0%" stop-color="#30205B"/>
      <stop offset="55%" stop-color="#12142C"/>
      <stop offset="100%" stop-color="#050610"/>
    </radialGradient>

    <linearGradient id="metal" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E9D5FF"/>
      <stop offset="75%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="glass" x2="1" y2="1">
      <stop offset="0%" stop-color="#263B59"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <radialGradient id="light">
      <stop offset="0%" stop-color="#8B5CF6"
            stop-opacity=".6"/>
      <stop offset="100%" stop-color="#8B5CF6"
            stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scan" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"
            stop-opacity="0"/>
      <stop offset="100%" stop-color="#22D3EE"
            stop-opacity=".45"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="documentClip">
      <rect x="12" y="12"
            width="246" height="306" rx="8"/>
    </clipPath>

  </defs>

  <!-- CINEMATIC BACKGROUND -->

  <rect width="1200" height="500"
        rx="20" fill="url(#bg)"/>

  <ellipse cx="900" cy="390"
           rx="290" ry="100"
           fill="url(#light)">

    <animate attributeName="opacity"
             values=".5;1;.5"
             dur="5s"
             repeatCount="indefinite"/>

  </ellipse>

  <!-- HOLOGRAPHIC PLATFORM -->

  <g fill="none" stroke="#A78BFA">

    <ellipse cx="900" cy="400"
             rx="240" ry="55"
             opacity=".25"/>

    <ellipse cx="900" cy="400"
             rx="190" ry="42"
             stroke-dasharray="35 15"
             opacity=".5">

      <animate attributeName="stroke-dashoffset"
               from="0" to="300"
               dur="10s"
               repeatCount="indefinite"/>

    </ellipse>

    <ellipse cx="900" cy="400"
             rx="140" ry="30"
             opacity=".6"/>

  </g>

  <!-- PROJECT LABEL -->

  <circle cx="50" cy="47" r="5"
          fill="#A78BFA"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values="1;.3;1"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>

  <text x="68" y="53"
        fill="#C4B5FD"
        font-family="monospace"
        font-size="15"
        letter-spacing="3">
    01 / FLAGSHIP AI PROJECT
  </text>

  <!-- METALLIC PROJECT TITLE -->

  <text x="47" y="145"
        font-family="Arial"
        font-size="84"
        font-weight="900"
        fill="url(#metal)">
    HireSmart
  </text>

  <text x="50" y="185"
        font-family="Arial"
        font-size="25"
        font-weight="bold"
        fill="#E2E8F0">
    AI-Powered Recruitment Platform
  </text>

  <!-- PROJECT FEATURES -->

  <g font-family="Arial"
     font-size="18"
     fill="#CBD5E1">

    <circle cx="55" cy="230" r="4"
            fill="#A78BFA"/>
    <text x="75" y="236">
      AI Resume Analysis
    </text>

    <circle cx="55" cy="267" r="4"
            fill="#A78BFA"/>
    <text x="75" y="273">
      Intelligent Candidate Matching
    </text>

    <circle cx="55" cy="304" r="4"
            fill="#A78BFA"/>
    <text x="75" y="310">
      Skill Gap Analysis
    </text>

    <circle cx="55" cy="341" r="4"
            fill="#A78BFA"/>
    <text x="75" y="347">
      Personalized Job Recommendations
    </text>

  </g>

  <!-- TECHNOLOGY STACK -->

  <g font-family="monospace"
     font-size="13"
     font-weight="bold"
     text-anchor="middle">

    <rect x="50" y="385"
          width="110" height="38"
          rx="6" fill="#10182E"
          stroke="#FFD343"/>
    <text x="105" y="409"
          fill="#FFD343">PYTHON</text>

    <rect x="172" y="385"
          width="110" height="38"
          rx="6" fill="#10182E"
          stroke="#4ADE80"/>
    <text x="227" y="409"
          fill="#4ADE80">DJANGO</text>

    <rect x="294" y="385"
          width="110" height="38"
          rx="6" fill="#10182E"
          stroke="#61DAFB"/>
    <text x="349" y="409"
          fill="#61DAFB">REACT</text>

    <rect x="416" y="385"
          width="145" height="38"
          rx="6" fill="#10182E"
          stroke="#60A5FA"/>
    <text x="488" y="409"
          fill="#93C5FD">POSTGRESQL</text>

  </g>

  <!-- FLOATING RESUME DOCUMENT -->

  <g transform="translate(720 55)">

    <g>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -10;0 0"
        dur="5s"
        repeatCount="indefinite"/>

      <g transform="rotate(-9 135 165)">

        <rect width="270" height="330"
              rx="14" fill="#111827"
              stroke="#A78BFA"
              stroke-width="2"/>

        <rect x="12" y="12"
              width="246" height="306"
              rx="8" fill="url(#glass)"/>

        <!-- Resume profile -->

        <circle cx="55" cy="60" r="26"
                fill="#334155"
                stroke="#64748B"/>

        <circle cx="55" cy="52" r="9"
                fill="#94A3B8"/>

        <path d="M37 77Q55 53 73 77"
              fill="#94A3B8"/>

        <text x="95" y="55"
              font-family="Arial"
              font-size="20"
              font-weight="bold"
              fill="#F1F5F9">
          RESUME
        </text>

        <text x="95" y="75"
              font-family="monospace"
              font-size="11"
              fill="#94A3B8">
          CANDIDATE PROFILE
        </text>

        <path d="M25 100H245"
              stroke="#475569"/>

        <!-- Resume content -->

        <g fill="#64748B" opacity=".7">

          <rect x="30" y="120"
                width="195" height="6" rx="3"/>

          <rect x="30" y="138"
                width="155" height="6" rx="3"/>

          <rect x="30" y="156"
                width="185" height="6" rx="3"/>

          <rect x="30" y="185"
                width="210" height="6" rx="3"/>

          <rect x="30" y="203"
                width="165" height="6" rx="3"/>

          <rect x="30" y="221"
                width="190" height="6" rx="3"/>

          <rect x="30" y="250"
                width="145" height="6" rx="3"/>

          <rect x="30" y="268"
                width="205" height="6" rx="3"/>

          <rect x="30" y="286"
                width="175" height="6" rx="3"/>

        </g>

        <!-- ANIMATED AI RESUME SCANNER -->

        <g clip-path="url(#documentClip)">

          <rect x="12" y="0"
                width="246" height="45"
                fill="url(#scan)">

            <animate attributeName="y"
                     values="-45;330;-45"
                     dur="5s"
                     repeatCount="indefinite"/>

          </rect>

          <rect x="12" y="45"
                width="246" height="2"
                fill="#67E8F9"
                filter="url(#glow)">

            <animate attributeName="y"
                     values="0;375;0"
                     dur="5s"
                     repeatCount="indefinite"/>

          </rect>

        </g>

      </g>

    </g>

  </g>

  <!-- FLOATING AI PROCESSING MODULE -->

  <g transform="translate(980 180)">

    <rect width="180" height="155"
          rx="14"
          fill="#10182E"
          stroke="#A78BFA"
          stroke-width="1.5"/>

    <circle cx="90" cy="60" r="39"
            fill="#151C32"
            stroke="#312E81"
            stroke-width="6"/>

    <circle cx="90" cy="60" r="39"
            fill="none"
            stroke="#A78BFA"
            stroke-width="5"
            stroke-linecap="round"
            stroke-dasharray="140 105"
            filter="url(#glow)">

      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 90 60"
        to="360 90 60"
        dur="4s"
        repeatCount="indefinite"/>

    </circle>

    <text x="90" y="70"
          text-anchor="middle"
          font-family="Arial"
          font-size="30"
          font-weight="bold"
          fill="#E9D5FF">
      AI
    </text>

    <text x="90" y="120"
          text-anchor="middle"
          font-family="monospace"
          font-size="12"
          fill="#67E8F9">
      RESUME ANALYSIS
    </text>

    <text x="90" y="139"
          text-anchor="middle"
          font-family="monospace"
          font-size="10"
          fill="#94A3B8">
      MATCHING ENGINE
    </text>

  </g>

  <!-- MOVING DATA PARTICLES -->

  <g fill="#C4B5FD" filter="url(#glow)">

    <circle r="4">
      <animateMotion
        path="M660 200Q800 50 1050 130"
        dur="5s"
        repeatCount="indefinite"/>
    </circle>

    <circle r="3">
      <animateMotion
        path="M700 350Q900 460 1130 350"
        dur="6s"
        repeatCount="indefinite"/>
    </circle>

    <circle r="3">
      <animateMotion
        path="M1100 80Q1000 30 800 50"
        dur="4s"
        repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- FOOTER -->

  <path d="M50 450H1150"
        stroke="#6366F1"
        opacity=".6"/>

  <text x="600" y="478"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        letter-spacing="4"
        fill="#C4B5FD">
    CONNECTING TALENT WITH OPPORTUNITY
  </text>

</svg>
