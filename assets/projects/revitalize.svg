
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500"
     viewBox="0 0 1200 500">

  <title>Revitalize - Waste Management System</title>

  <defs>

    <radialGradient id="bg" cx="75%" cy="45%">
      <stop offset="0%" stop-color="#164E3C"/>
      <stop offset="55%" stop-color="#0A211C"/>
      <stop offset="100%" stop-color="#030B0C"/>
    </radialGradient>

    <linearGradient id="metal" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#D1FAE5"/>
      <stop offset="65%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <radialGradient id="planet" cx="30%" cy="25%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="40%" stop-color="#15803D"/>
      <stop offset="75%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>

    <radialGradient id="atmosphere">
      <stop offset="0%" stop-color="#34D399"
            stop-opacity=".3"/>
      <stop offset="65%" stop-color="#10B981"
            stop-opacity=".15"/>
      <stop offset="100%" stop-color="#10B981"
            stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="orbit">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="50%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="earthClip">
      <circle cx="0" cy="0" r="125"/>
    </clipPath>

    <!-- Reusable Leaf -->

    <g id="leaf">
      <path d="M0 0Q-25 -40 25 -65Q40 -15 0 0Z"
            fill="#34D399"
            stroke="#86EFAC"/>
      <path d="M0 0L25 -65"
            stroke="#D1FAE5"
            opacity=".7"/>
    </g>

  </defs>

  <!-- CINEMATIC BACKGROUND -->

  <rect width="1200" height="500"
        rx="20" fill="url(#bg)"/>

  <circle cx="900" cy="240"
          r="260"
          fill="url(#atmosphere)">

    <animate attributeName="opacity"
             values=".5;1;.5"
             dur="5s"
             repeatCount="indefinite"/>

  </circle>

  <!-- PERSPECTIVE GRID -->

  <g stroke="#34D399"
     opacity=".09" fill="none">

    <path d="M900 300L0 500"/>
    <path d="M900 300L200 500"/>
    <path d="M900 300L400 500"/>
    <path d="M900 300L600 500"/>
    <path d="M900 300L800 500"/>
    <path d="M900 300L1000 500"/>
    <path d="M900 300L1200 500"/>

    <path d="M0 330H1200"/>
    <path d="M0 365H1200"/>
    <path d="M0 410H1200"/>
    <path d="M0 460H1200"/>

  </g>

  <!-- PROJECT LABEL -->

  <circle cx="50" cy="47" r="5"
          fill="#4ADE80"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values="1;.3;1"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>

  <text x="68" y="53"
        fill="#6EE7B7"
        font-family="monospace"
        font-size="15"
        letter-spacing="3">
    03 / SUSTAINABLE TECHNOLOGY
  </text>

  <!-- METALLIC PROJECT TITLE -->

  <text x="47" y="145"
        font-family="Arial"
        font-size="84"
        font-weight="900"
        fill="url(#metal)">
    Revitalize
  </text>

  <text x="50" y="185"
        font-family="Arial"
        font-size="25"
        font-weight="bold"
        fill="#E2E8F0">
    Waste Management System
  </text>

  <!-- PROJECT FEATURES -->

  <g font-family="Arial"
     font-size="18"
     fill="#CBD5E1">

    <circle cx="55" cy="230" r="4"
            fill="#4ADE80"/>
    <text x="75" y="236">
      Waste Management Awareness
    </text>

    <circle cx="55" cy="267" r="4"
            fill="#4ADE80"/>
    <text x="75" y="273">
      Sustainable Waste Disposal
    </text>

    <circle cx="55" cy="304" r="4"
            fill="#4ADE80"/>
    <text x="75" y="310">
      Recycling &amp; Environmental Education
    </text>

    <circle cx="55" cy="341" r="4"
            fill="#4ADE80"/>
    <text x="75" y="347">
      Responsive Web Experience
    </text>

  </g>

  <!-- TECHNOLOGY STACK -->

  <g font-family="monospace"
     font-size="14"
     font-weight="bold"
     text-anchor="middle">

    <rect x="50" y="385"
          width="110" height="38"
          rx="6" fill="#09251E"
          stroke="#F97316"/>

    <text x="105" y="409"
          fill="#FB923C">HTML5</text>

    <rect x="172" y="385"
          width="110" height="38"
          rx="6" fill="#09251E"
          stroke="#38BDF8"/>

    <text x="227" y="409"
          fill="#38BDF8">CSS3</text>

    <rect x="294" y="385"
          width="155" height="38"
          rx="6" fill="#09251E"
          stroke="#FACC15"/>

    <text x="371" y="409"
          fill="#FACC15">JAVASCRIPT</text>

  </g>

  <!-- DIGITAL PLANET -->

  <g transform="translate(900 240)">

    <!-- Outer Atmospheric Glow -->

    <circle r="155"
            fill="url(#atmosphere)"/>

    <!-- Animated Orbital Rings -->

    <g fill="none"
       stroke="url(#orbit)"
       stroke-width="1.5">

      <ellipse rx="185" ry="75"
               transform="rotate(-25)"
               opacity=".65"/>

      <ellipse rx="200" ry="90"
               transform="rotate(25)"
               opacity=".35"/>

      <ellipse rx="175" ry="65"
               stroke-dasharray="25 15"
               transform="rotate(-25)">

        <animate attributeName="stroke-dashoffset"
                 from="0" to="400"
                 dur="12s"
                 repeatCount="indefinite"/>

      </ellipse>

    </g>

    <!-- Planet Surface -->

    <circle r="125"
            fill="url(#planet)"
            stroke="#6EE7B7"
            stroke-width="2"/>

    <g clip-path="url(#earthClip)">

      <!-- Animated Surface Patterns -->

      <g fill="#86EFAC" opacity=".35">

        <path d="M-140 -65L-95 -95L-55 -70
                 L-25 -45L-50 -15L-85 -5
                 L-75 30L-110 60L-140 15Z"/>

        <path d="M-10 -75L45 -105L85 -75
                 L100 -30L65 -5L45 50
                 L10 35L-5 -10Z"/>

        <path d="M85 55L130 30L155 75
                 L120 115L75 90Z"/>

        <animateTransform
          attributeName="transform"
          type="translate"
          values="-20 0;20 0;-20 0"
          dur="12s"
          repeatCount="indefinite"/>

      </g>

      <!-- Holographic Globe Grid -->

      <g fill="none"
         stroke="#A7F3D0"
         stroke-width="1"
         opacity=".3">

        <ellipse rx="125" ry="45"/>
        <ellipse rx="125" ry="90"/>
        <ellipse rx="45" ry="125"/>
        <ellipse rx="90" ry="125"/>

        <path d="M-125 0H125"/>
        <path d="M0 -125V125"/>

      </g>

    </g>

    <!-- ROTATING RECYCLING SYMBOL -->

    <g fill="#D1FAE5"
       filter="url(#glow)">

      <g>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0"
          to="360"
          dur="18s"
          repeatCount="indefinite"/>

        <path d="M-15 -82
                 Q15 -90 32 -60
                 L48 -32
                 L65 -42
                 L55 5
                 L10 -12
                 L27 -22
                 L12 -50
                 Q4 -62 -10 -56
                 L-28 -30
                 L-52 -45Z"/>

        <path d="M-15 -82
                 Q15 -90 32 -60
                 L48 -32
                 L65 -42
                 L55 5
                 L10 -12
                 L27 -22
                 L12 -50
                 Q4 -62 -10 -56
                 L-28 -30
                 L-52 -45Z"
              transform="rotate(120)"/>

        <path d="M-15 -82
                 Q15 -90 32 -60
                 L48 -32
                 L65 -42
                 L55 5
                 L10 -12
                 L27 -22
                 L12 -50
                 Q4 -62 -10 -56
                 L-28 -30
                 L-52 -45Z"
              transform="rotate(240)"/>

      </g>

    </g>

    <!-- Moving Orbital Particles -->

    <g transform="rotate(-25)">

      <circle r="5"
              fill="#D1FAE5"
              filter="url(#glow)">

        <animateMotion
          path="M185 0
                A185 75 0 1 1 -185 0
                A185 75 0 1 1 185 0"
          dur="7s"
          repeatCount="indefinite"/>

      </circle>

      <circle r="4"
              fill="#4ADE80"
              filter="url(#glow)">

        <animateMotion
          path="M-185 0
                A185 75 0 1 1 185 0
                A185 75 0 1 1 -185 0"
          dur="7s"
          repeatCount="indefinite"/>

      </circle>

    </g>

  </g>

  <!-- FLOATING GREEN LEAVES -->

  <g transform="translate(690 120) rotate(-25) scale(.7)">

    <g>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -15;0 0"
        dur="5s"
        repeatCount="indefinite"/>

      <use href="#leaf"/>

    </g>

  </g>

  <g transform="translate(1090 365) rotate(40) scale(.8)">

    <g>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -20;0 0"
        dur="6s"
        repeatCount="indefinite"/>

      <use href="#leaf"/>

    </g>

  </g>

  <!-- FLOATING ENERGY PARTICLES -->

  <g fill="#6EE7B7"
     filter="url(#glow)">

    <circle r="3">

      <animateMotion
        path="M650 200Q900 20 1150 150"
        dur="6s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="4">

      <animateMotion
        path="M1100 350Q900 460 650 350"
        dur="7s"
        repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- FOOTER -->

  <path d="M50 450H1150"
        stroke="#059669"
        opacity=".7"/>

  <circle cx="50" cy="450"
          r="4"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="50;1150;50"
             dur="8s"
             repeatCount="indefinite"/>

  </circle>

  <text x="600" y="478"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        letter-spacing="4"
        fill="#6EE7B7">
    ENGINEERING A GREENER TOMORROW
  </text>

</svg>
