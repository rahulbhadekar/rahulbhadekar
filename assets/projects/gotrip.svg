
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="500"
     viewBox="0 0 1200 500">

  <title>GoTrip - Full Stack Travel Booking Application</title>

  <defs>

    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#0C2942"/>
      <stop offset="80%" stop-color="#164E63"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <linearGradient id="gold">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#FEF3C7"/>
      <stop offset="70%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <radialGradient id="earth" cx="30%" cy="25%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="45%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </radialGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#22D3EE"
            stop-opacity=".4"/>
      <stop offset="100%" stop-color="#22D3EE"
            stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="earthClip">
      <circle r="145"/>
    </clipPath>

  </defs>

  <!-- CINEMATIC BACKGROUND -->

  <rect width="1200" height="500"
        rx="20" fill="url(#sky)"/>

  <!-- TWINKLING STARS -->

  <g fill="#FFFFFF">

    <circle cx="650" cy="40" r="2">
      <animate attributeName="opacity"
        values=".2;1;.2" dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1080" cy="65" r="3">
      <animate attributeName="opacity"
        values="1;.2;1" dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="100" r="2">
      <animate attributeName="opacity"
        values=".2;1;.2" dur="2s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="1150" cy="140" r="2">
      <animate attributeName="opacity"
        values="1;.2;1" dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="920" cy="30" r="2"/>
    <circle cx="570" cy="75" r="2"/>
    <circle cx="1120" cy="230" r="2"/>

  </g>

  <!-- MOUNTAIN LANDSCAPE -->

  <path d="M550 440L720 250L850 440
           L1000 290L1200 440V500H550Z"
        fill="#071C2C" opacity=".85"/>

  <path d="M660 317L720 250L780 338
           L720 307Z"
        fill="#CBD5E1" opacity=".7"/>

  <path d="M940 350L1000 290L1060 350
           L1000 330Z"
        fill="#CBD5E1" opacity=".6"/>

  <!-- PROJECT LABEL -->

  <circle cx="50" cy="47" r="5"
          fill="#FBBF24" filter="url(#glow)">

    <animate attributeName="opacity"
      values="1;.3;1" dur="2s"
      repeatCount="indefinite"/>

  </circle>

  <text x="68" y="53"
        fill="#FCD34D"
        font-family="monospace"
        font-size="15"
        letter-spacing="3">
    03 / FULL STACK TRAVEL PLATFORM
  </text>

  <!-- METALLIC TITLE -->

  <text x="47" y="145"
        font-family="Arial"
        font-size="95"
        font-weight="900"
        fill="url(#gold)">
    GoTrip
  </text>

  <text x="50" y="185"
        font-family="Arial"
        font-size="25"
        font-weight="bold"
        fill="#F1F5F9">
    Travel &amp; Tour Booking Application
  </text>

  <!-- PROJECT FEATURES -->

  <g font-family="Arial"
     font-size="18"
     fill="#E2E8F0">

    <circle cx="55" cy="230" r="4"
            fill="#FBBF24"/>
    <text x="75" y="236">
      Tour Discovery &amp; Booking Management
    </text>

    <circle cx="55" cy="267" r="4"
            fill="#FBBF24"/>
    <text x="75" y="273">
      JWT Authentication &amp; Role-Based Access
    </text>

    <circle cx="55" cy="304" r="4"
            fill="#FBBF24"/>
    <text x="75" y="310">
      Admin Dashboard &amp; User Management
    </text>

    <circle cx="55" cy="341" r="4"
            fill="#FBBF24"/>
    <text x="75" y="347">
      Spring Boot REST APIs &amp; Database Integration
    </text>

  </g>

  <!-- TECHNOLOGY STACK -->

  <g font-family="monospace"
     font-size="13"
     font-weight="bold"
     text-anchor="middle">

    <rect x="50" y="385"
          width="100" height="38" rx="6"
          fill="#071C2C" stroke="#FB923C"/>

    <text x="100" y="409"
          fill="#FB923C">JAVA</text>

    <rect x="162" y="385"
          width="145" height="38" rx="6"
          fill="#071C2C" stroke="#4ADE80"/>

    <text x="234" y="409"
          fill="#4ADE80">SPRING BOOT</text>

    <rect x="319" y="385"
          width="105" height="38" rx="6"
          fill="#071C2C" stroke="#38BDF8"/>

    <text x="371" y="409"
          fill="#38BDF8">MYSQL</text>

    <rect x="436" y="385"
          width="90" height="38" rx="6"
          fill="#071C2C" stroke="#FBBF24"/>

    <text x="481" y="409"
          fill="#FBBF24">JWT</text>

  </g>

  <!-- DIGITAL TRAVEL PLANET -->

  <g transform="translate(910 225)">

    <circle r="205" fill="url(#halo)">

      <animate attributeName="opacity"
        values=".5;1;.5" dur="5s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="145"
            fill="url(#earth)"
            stroke="#67E8F9"
            stroke-width="2"/>

    <!-- ANIMATED CONTINENTS -->

    <g clip-path="url(#earthClip)">

      <g fill="#34D399" opacity=".65">

        <path d="M-140 -80L-90 -125L-45 -90
                 L-20 -50L-65 -20L-80 20
                 L-120 5Z"/>

        <path d="M10 -110L65 -125L110 -85
                 L95 -30L55 -10L40 40
                 L5 20L-10 -40Z"/>

        <path d="M65 60L115 30L155 65
                 L130 115L85 125Z"/>

        <animateTransform
          attributeName="transform"
          type="translate"
          values="-25 0;25 0;-25 0"
          dur="15s"
          repeatCount="indefinite"/>

      </g>

      <!-- GLOBE GRID -->

      <g fill="none"
         stroke="#A5F3FC"
         opacity=".25">

        <ellipse rx="145" ry="50"/>
        <ellipse rx="145" ry="100"/>
        <ellipse rx="50" ry="145"/>
        <ellipse rx="100" ry="145"/>

        <path d="M-145 0H145"/>
        <path d="M0 -145V145"/>

      </g>

    </g>

    <!-- DESTINATION MARKERS -->

    <g fill="#FBBF24"
       filter="url(#glow)">

      <circle cx="-70" cy="-50" r="5">
        <animate attributeName="opacity"
          values="1;.2;1" dur="2s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="65" cy="-45" r="5">
        <animate attributeName="opacity"
          values=".2;1;.2" dur="3s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="70" cy="80" r="5"/>

    </g>

    <!-- TRAVEL ROUTES -->

    <g fill="none"
       stroke="#FBBF24"
       stroke-width="2"
       stroke-dasharray="7 7">

      <path d="M-70 -50Q0 -150 65 -45">

        <animate attributeName="stroke-dashoffset"
          from="0" to="-140" dur="5s"
          repeatCount="indefinite"/>

      </path>

      <path d="M65 -45Q145 0 70 80">

        <animate attributeName="stroke-dashoffset"
          from="0" to="-140" dur="5s"
          repeatCount="indefinite"/>

      </path>

    </g>

    <!-- ORBITAL FLIGHT PATH -->

    <g transform="rotate(-25)">

      <ellipse rx="220" ry="90"
               fill="none"
               stroke="#FBBF24"
               stroke-width="1.5"
               stroke-dasharray="10 8"
               opacity=".7">

        <animate attributeName="stroke-dashoffset"
          from="0" to="180" dur="10s"
          repeatCount="indefinite"/>

      </ellipse>

      <!-- ANIMATED AIRPLANE -->

      <g fill="#FFFFFF"
         stroke="#BFDBFE"
         stroke-width=".5">

        <path d="M28 0L8 -5L-5 -26
                 L-12 -26L-5 -5
                 L-24 -4L-31 -12
                 L-36 -12L-32 0
                 L-36 12L-31 12
                 L-24 4L-5 5
                 L-12 26L-5 26
                 L8 5Z"/>

        <animateMotion
          path="M220 0
                A220 90 0 1 1 -220 0
                A220 90 0 1 1 220 0"
          rotate="auto"
          dur="10s"
          repeatCount="indefinite"/>

      </g>

    </g>

  </g>

  <!-- FOOTER -->

  <path d="M50 450H1150"
        stroke="#FBBF24"
        opacity=".5"/>

  <circle cx="50" cy="450" r="4"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="cx"
      values="50;1150;50" dur="8s"
      repeatCount="indefinite"/>

  </circle>

  <text x="600" y="478"
        text-anchor="middle"
        font-family="monospace"
        font-size="14"
        letter-spacing="4"
        fill="#FCD34D">
    EXPLORE / BOOK / EXPERIENCE
  </text>

</svg>
