
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="760"
     viewBox="0 0 1200 760">

  <title>AI Engineering Architecture</title>

  <defs>

    <radialGradient id="bg">
      <stop offset="0%" stop-color="#152746"/>
      <stop offset="100%" stop-color="#030610"/>
    </radialGradient>

    <linearGradient id="panel" x2="1" y2="1">
      <stop offset="0%" stop-color="#15263E"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>

    <linearGradient id="neon">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="35" height="35"
             patternUnits="userSpaceOnUse">
      <path d="M35 0H0V35"
            fill="none"
            stroke="#22D3EE"
            opacity=".05"/>
    </pattern>

  </defs>

  <!-- BACKGROUND -->

  <rect width="1200" height="760"
        rx="20" fill="url(#bg)"/>

  <rect width="1200" height="760"
        rx="20" fill="url(#grid)"/>

  <!-- ANIMATED BORDER -->

  <rect x="15" y="15"
        width="1170" height="730"
        rx="15"
        fill="none"
        stroke="url(#neon)"
        stroke-width="2"
        stroke-dasharray="100 20">

    <animate attributeName="stroke-dashoffset"
             from="0" to="480"
             dur="15s"
             repeatCount="indefinite"/>

  </rect>

  <!-- TITLE -->

  <text x="600" y="60"
        text-anchor="middle"
        fill="#67E8F9"
        font-family="Arial"
        font-size="32"
        font-weight="bold"
        letter-spacing="4">
    AI ENGINEERING ARCHITECTURE
  </text>

  <text x="600" y="90"
        text-anchor="middle"
        fill="#94A3B8"
        font-family="monospace"
        font-size="15"
        letter-spacing="4">
    FROM DATA TO INTELLIGENT SYSTEMS
  </text>

  <!-- DATA FLOW CONNECTION -->

  <path d="M600 130V665"
        stroke="#22D3EE"
        stroke-width="3"
        stroke-dasharray="8 10"
        opacity=".7">

    <animate attributeName="stroke-dashoffset"
             from="0" to="-180"
             dur="5s"
             repeatCount="indefinite"/>

  </path>

  <!-- LAYER 01: DATA FOUNDATION -->

  <g>

    <rect x="90" y="120"
          width="1020" height="80"
          rx="12"
          fill="url(#panel)"
          stroke="#FFD343"/>

    <rect x="90" y="120"
          width="5" height="80"
          rx="2" fill="#FFD343"/>

    <circle cx="120" cy="145" r="5"
            fill="#FFD343"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <text x="140" y="151"
          fill="#FFD343"
          font-family="monospace"
          font-size="20"
          font-weight="bold">
      01 // DATA FOUNDATION
    </text>

    <text x="140" y="180"
          fill="#CBD5E1"
          font-family="Arial"
          font-size="17">
      Python | NumPy | Pandas | SQL | Data Processing
    </text>

    <text x="1080" y="151"
          text-anchor="end"
          fill="#FFD343"
          font-family="monospace"
          font-size="13">
      DATA INPUT
    </text>

  </g>

  <!-- LAYER 02: MACHINE LEARNING -->

  <g>

    <rect x="90" y="215"
          width="1020" height="80"
          rx="12"
          fill="url(#panel)"
          stroke="#38BDF8"/>

    <rect x="90" y="215"
          width="5" height="80"
          rx="2" fill="#38BDF8"/>

    <circle cx="120" cy="240" r="5"
            fill="#38BDF8"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <text x="140" y="246"
          fill="#38BDF8"
          font-family="monospace"
          font-size="20"
          font-weight="bold">
      02 // MACHINE LEARNING
    </text>

    <text x="140" y="275"
          fill="#CBD5E1"
          font-family="Arial"
          font-size="17">
      Scikit-learn | Feature Engineering | Model Evaluation
    </text>

    <text x="1080" y="246"
          text-anchor="end"
          fill="#38BDF8"
          font-family="monospace"
          font-size="13">
      PREDICTIVE MODELS
    </text>

  </g>

  <!-- LAYER 03: DEEP LEARNING -->

  <g>

    <rect x="90" y="310"
          width="1020" height="80"
          rx="12"
          fill="url(#panel)"
          stroke="#A78BFA"/>

    <rect x="90" y="310"
          width="5" height="80"
          rx="2" fill="#A78BFA"/>

    <circle cx="120" cy="335" r="5"
            fill="#A78BFA"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <text x="140" y="341"
          fill="#C4B5FD"
          font-family="monospace"
          font-size="20"
          font-weight="bold">
      03 // DEEP LEARNING
    </text>

    <text x="140" y="370"
          fill="#CBD5E1"
          font-family="Arial"
          font-size="17">
      PyTorch | TensorFlow | Neural Networks | Computer Vision
    </text>

    <text x="1080" y="341"
          text-anchor="end"
          fill="#A78BFA"
          font-family="monospace"
          font-size="13">
      NEURAL SYSTEMS
    </text>

  </g>

  <!-- LAYER 04: GENERATIVE AI -->

  <g>

    <rect x="90" y="405"
          width="1020" height="80"
          rx="12"
          fill="url(#panel)"
          stroke="#22D3EE"/>

    <rect x="90" y="405"
          width="5" height="80"
          rx="2" fill="#22D3EE"/>

    <circle cx="120" cy="430" r="5"
            fill="#22D3EE"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <text x="140" y="436"
          fill="#67E8F9"
          font-family="monospace"
          font-size="20"
          font-weight="bold">
      04 // GENERATIVE AI &amp; LLMs
    </text>

    <text x="140" y="465"
          fill="#CBD5E1"
          font-family="Arial"
          font-size="17">
      Transformers | NLP | Hugging Face | Prompt Engineering
    </text>

    <text x="1080" y="436"
          text-anchor="end"
          fill="#22D3EE"
          font-family="monospace"
          font-size="13">
      GENERATIVE SYSTEMS
    </text>

  </g>

  <!-- LAYER 05: RAG AND AGENTIC AI -->

  <g>

    <rect x="90" y="500"
          width="1020" height="80"
          rx="12"
          fill="url(#panel)"
          stroke="#C084FC"/>

    <rect x="90" y="500"
          width="5" height="80"
          rx="2" fill="#C084FC"/>

    <circle cx="120" cy="525" r="5"
            fill="#C084FC"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <text x="140" y="531"
          fill="#D8B4FE"
          font-family="monospace"
          font-size="20"
          font-weight="bold">
      05 // RAG &amp; AGENTIC AI
    </text>

    <text x="140" y="560"
          fill="#CBD5E1"
          font-family="Arial"
          font-size="17">
      LangChain | LangGraph | Vector Databases | AI Agents
    </text>

    <text x="1080" y="531"
          text-anchor="end"
          fill="#C084FC"
          font-family="monospace"
          font-size="13">
      INTELLIGENT AGENTS
    </text>

  </g>

  <!-- LAYER 06: DEPLOYMENT AND MLOPS -->

  <g>

    <rect x="90" y="595"
          width="1020" height="80"
          rx="12"
          fill="url(#panel)"
          stroke="#4ADE80"/>

    <rect x="90" y="595"
          width="5" height="80"
          rx="2" fill="#4ADE80"/>

    <circle cx="120" cy="620" r="5"
            fill="#4ADE80"
            filter="url(#glow)">
      <animate attributeName="opacity"
               values="1;.3;1"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <text x="140" y="626"
          fill="#4ADE80"
          font-family="monospace"
          font-size="20"
          font-weight="bold">
      06 // DEPLOYMENT &amp; MLOps
    </text>

    <text x="140" y="655"
          fill="#CBD5E1"
          font-family="Arial"
          font-size="17">
      FastAPI | Docker | Cloud | Model Serving | Monitoring
    </text>

    <text x="1080" y="626"
          text-anchor="end"
          fill="#4ADE80"
          font-family="monospace"
          font-size="13">
      PRODUCTION SYSTEMS
    </text>

  </g>

  <!-- ANIMATED SIDE DATA CHANNELS -->

  <path d="M55 140V655"
        stroke="#22D3EE"
        stroke-width="2"
        opacity=".35"/>

  <path d="M1145 140V655"
        stroke="#8B5CF6"
        stroke-width="2"
        opacity=".35"/>

  <circle cx="55" cy="140" r="5"
          fill="#22D3EE"
          filter="url(#glow)">

    <animate attributeName="cy"
             values="140;655;140"
             dur="7s"
             repeatCount="indefinite"/>

  </circle>

  <circle cx="1145" cy="655" r="5"
          fill="#A78BFA"
          filter="url(#glow)">

    <animate attributeName="cy"
             values="655;140;655"
             dur="7s"
             repeatCount="indefinite"/>

  </circle>

  <!-- FOOTER -->

  <path d="M90 700H1110"
        stroke="url(#neon)"
        stroke-width="2"/>

  <circle cx="90" cy="700" r="4"
          fill="#FFFFFF"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="90;1110;90"
             dur="8s"
             repeatCount="indefinite"/>

  </circle>

  <text x="600" y="727"
        text-anchor="middle"
        fill="#67E8F9"
        font-family="monospace"
        font-size="15"
        letter-spacing="4">
    DATA → MODELS → INTELLIGENCE → IMPACT
  </text>

</svg>
