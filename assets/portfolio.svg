
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="480"
     viewBox="0 0 1200 480">

  <title>Rahul Bhadekar - Digital Portfolio</title>

  <defs>

    <radialGradient id="bg" cx="70%" cy="45%">
      <stop offset="0%" stop-color="#193653"/>
      <stop offset="55%" stop-color="#0B1729"/>
      <stop offset="100%" stop-color="#03060D"/>
    </radialGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="30%" stop-color="#64748B"/>
      <stop offset="65%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="title">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="screen" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#172B49"/>
    </linearGradient>

    <radialGradient id="floor">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shine">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screenClip">
      <path d="M12 13L488 34L488 266L12 245Z"/>
    </clipPath>

  </defs>

  <!-- CINEMATIC BACKGROUND -->

  <rect width="1200" height="480"
        rx="20" fill="url(#bg)"/>

  <ellipse cx="835" cy="395"
           rx="350" ry="85"
           fill="url(#floor)">

    <animate attributeName="opacity"
             values=".5;1;.5"
             dur="5s"
             repeatCount="indefinite"/>

  </ellipse>

  <!-- PERSPECTIVE FLOOR -->

  <g stroke="#38BDF8" opacity=".13" fill="none">

    <path d="M600 300L-200 480"/>
    <path d="M600 300L0 480"/>
    <path d="M600 300L200 480"/>
    <path d="M600 300L400 480"/>
    <path d="M600 300L600 480"/>
    <path d="M600 300L800 480"/>
    <path d="M600 300L1000 480"/>
    <path d="M600 300L1200 480"/>
    <path d="M600 300L1400 480"/>

    <path d="M0 320H1200"/>
    <path d="M0 345H1200"/>
    <path d="M0 380H1200"/>
    <path d="M0 425H1200"/>
    <path d="M0 479H1200"/>

  </g>

  <!-- FLOATING PARTICLES -->

  <g fill="#67E8F9">

    <circle cx="450" cy="100" r="2">
      <animate attributeName="cy"
               values="100;60;100"
               dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1100" cy="80" r="3">
      <animate attributeName="cy"
               values="80;140;80"
               dur="6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="500" cy="360" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1140" cy="350" r="2">
      <animate attributeName="opacity"
               values="1;.2;1"
               dur="4s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- LEFT TYPOGRAPHY -->

  <text x="50" y="60"
        fill="#67E8F9"
        font-family="monospace"
        font-size="14"
        letter-spacing="3">
    RAHUL OS 2.0
  </text>

  <text x="50" y="88"
        fill="#64748B"
        font-family="monospace"
        font-size="13"
        letter-spacing="2">
    AI ENGINEER EDITION
  </text>

  <text x="50" y="165"
        fill="#F8FAFC"
        font-family="Arial"
        font-size="62"
        font-weight="900">
    BEYOND
  </text>

  <text x="50" y="230"
        fill="url(#title)"
        font-family="Arial"
        font-size="67"
        font-weight="900">
    THE CODE.
  </text>

  <text x="50" y="275"
        fill="#94A3B8"
        font-family="Arial"
        font-size="20">
    Intelligence meets engineering.
  </text>

  <text x="50" y="305"
        fill="#94A3B8"
        font-family="Arial"
        font-size="20">
    Ideas become digital experiences.
  </text>

  <!-- PORTFOLIO CALL TO ACTION -->

  <rect x="50" y="340"
        width="315" height="55"
        rx="8"
        fill="#0C2840"
        stroke="#22D3EE"
        stroke-width="1.5">

    <animate attributeName="stroke-opacity"
             values=".5;1;.5"
             dur="3s"
             repeatCount="indefinite"/>

  </rect>

  <text x="195" y="374"
        text-anchor="middle"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        fill="#67E8F9">
    EXPLORE PORTFOLIO
  </text>

  <path d="M320 359L333 367L320 375"
        fill="none"
        stroke="#67E8F9"
        stroke-width="2">

    <animateTransform attributeName="transform"
      type="translate"
      values="0 0;6 0;0 0"
      dur="1.8s"
      repeatCount="indefinite"/>

  </path>

  <!-- FLOATING 3D LAPTOP -->

  <g transform="translate(590 65)">

    <g>

      <animateTransform attributeName="transform"
        type="translate"
        values="0 0;0 -12;0 0"
        dur="5s"
        repeatCount="indefinite"/>

      <!-- Laptop frame -->

      <path d="M0 0L500 22L500 280L0 258Z"
            fill="url(#metal)"
            stroke="#94A3B8"
            stroke-width="2"/>

      <path d="M12 13L488 34L488 266L12 245Z"
            fill="url(#screen)"
            stroke="#22D3EE"
            stroke-opacity=".6"/>

      <!-- Screen content -->

      <g transform="matrix(1 .044 0 1 28 30)">

        <text x="0" y="15"
              fill="#67E8F9"
              font-family="monospace"
              font-size="15"
              font-weight="bold">
          RAHUL.DEV
        </text>

        <text x="235" y="15"
              fill="#94A3B8"
              font-family="monospace"
              font-size="11">
          HOME / ABOUT / PROJECTS
        </text>

        <path d="M0 30H440"
              stroke="#164E63"/>

        <text x="15" y="80"
              font-family="Arial"
              font-size="37"
              font-weight="bold"
              fill="#F8FAFC">
          RAHUL
        </text>

        <text x="15" y="119"
              font-family="Arial"
              font-size="37"
              font-weight="bold"
              fill="url(#title)">
          BHADEKAR
        </text>

        <text x="15" y="148"
              font-family="monospace"
              font-size="12"
              fill="#A78BFA">
          PYTHON / AI / FULL STACK
        </text>

        <rect x="15" y="170"
              width="160" height="30"
              rx="5"
              fill="#0891B2"/>

        <text x="95" y="189"
              text-anchor="middle"
              font-family="monospace"
              font-size="11"
              fill="#FFFFFF">
          VIEW PROJECTS
        </text>

        <!-- AI hologram -->

        <g transform="translate(350 125)">

          <ellipse rx="78" ry="36"
                   fill="none"
                   stroke="#22D3EE"
                   stroke-width="2">

            <animateTransform attributeName="transform"
              type="rotate"
              from="0" to="360"
              dur="9s"
              repeatCount="indefinite"/>

          </ellipse>

          <ellipse rx="65" ry="28"
                   fill="none"
                   stroke="#8B5CF6"
                   stroke-width="2">

            <animateTransform attributeName="transform"
              type="rotate"
              from="360" to="0"
              dur="7s"
              repeatCount="indefinite"/>

          </ellipse>

          <circle r="42"
                  fill="#0C233A"
                  stroke="#67E8F9"
                  stroke-width="2"/>

          <circle r="33"
                  fill="#0E7490"
                  opacity=".5">

            <animate attributeName="opacity"
                     values=".3;.8;.3"
                     dur="3s"
                     repeatCount="indefinite"/>

          </circle>

          <text y="10"
                text-anchor="middle"
                fill="#FFFFFF"
                font-family="Arial"
                font-size="28"
                font-weight="bold">
            AI
          </text>

        </g>

      </g>

      <!-- Moving screen reflection -->

      <g clip-path="url(#screenClip)">

        <path d="M-180 0H-100L40 280H-40Z"
              fill="url(#shine)">

          <animateTransform attributeName="transform"
            type="translate"
            values="0 0;750 0;750 0"
            keyTimes="0;.65;1"
            dur="7s"
            repeatCount="indefinite"/>

        </path>

      </g>

      <!-- Laptop base -->

      <path d="M0 258L500 280L565 325L-60 300Z"
            fill="url(#metal)"
            stroke="#64748B"/>

      <path d="M30 266L470 286L510 307L0 287Z"
            fill="#0F172A"
            stroke="#475569"/>

      <!-- Keyboard lines -->

      <g stroke="#64748B" opacity=".5">
        <path d="M20 273L480 293"/>
        <path d="M12 279L492 299"/>
        <path d="M100 269L80 290"/>
        <path d="M160 272L145 293"/>
        <path d="M220 275L210 295"/>
        <path d="M280 278L280 298"/>
        <path d="M340 281L350 301"/>
        <path d="M400 284L420 304"/>
      </g>

      <path d="M-60 300L565 325L555 335L-45 310Z"
            fill="#475569"/>

      <path d="M-45 310L555 335"
            stroke="#22D3EE"
            stroke-opacity=".6"/>

    </g>

  </g>

  <!-- BOTTOM BRANDING -->

  <path d="M50 435H1150"
        stroke="#164E63"/>

  <text x="50" y="460"
        font-family="monospace"
        font-size="12"
        letter-spacing="3"
        fill="#64748B">
    DESIGN / DEVELOP / DEPLOY
  </text>

  <circle cx="1010" cy="455"
          r="5" fill="#4ADE80">

    <animate attributeName="opacity"
             values="1;.3;1"
             dur="2s"
             repeatCount="indefinite"/>

  </circle>

  <text x="1025" y="460"
        fill="#4ADE80"
        font-family="monospace"
        font-size="13">
    PORTFOLIO
  </text>

</svg>
