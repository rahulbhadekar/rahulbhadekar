
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600"
     viewBox="0 0 800 600"
     preserveAspectRatio="xMidYMid meet">

  <title>HireSmart - AI Powered Recruitment Platform</title>

  <defs>

    <radialGradient id="bg" cx=".5" cy=".4" r=".8">
      <stop stop-color="#19375e"/>
      <stop offset=".5" stop-color="#101d33"/>
      <stop offset="1" stop-color="#060b14"/>
    </radialGradient>

    <linearGradient id="accent">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="metal" x2="0" y2="1">
      <stop stop-color="#64748b"/>
      <stop offset=".15" stop-color="#26354d"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>

    <linearGradient id="panel" x2="1" y2="1">
      <stop stop-color="#1c2d48"/>
      <stop offset="1" stop-color="#10192b"/>
    </linearGradient>

    <linearGradient id="paper" x2="1" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>

    <linearGradient id="scan" x2="0" y2="1">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".8" stop-color="#22d3ee" stop-opacity=".35"/>
      <stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="15"/>
    </filter>

    <pattern id="grid" width="30" height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30"
            fill="none" stroke="#94a3b8"
            stroke-opacity=".055"/>
    </pattern>

    <clipPath id="resumeClip">
      <rect x="263" y="232"
            width="130" height="210" rx="7"/>
    </clipPath>

  </defs>

  <!-- Cinematic background -->

  <rect width="800" height="600"
        rx="22" fill="url(#bg)"/>

  <rect width="800" height="600"
        rx="22" fill="url(#grid)"/>

  <!-- Ambient light -->

  <ellipse cx="400" cy="310"
           rx="320" ry="200"
           fill="#2563eb" opacity=".08"
           filter="url(#shadow)"/>

  <!-- Project branding -->

  <text x="400" y="65"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="46" font-weight="800"
        fill="#f1f5f9">
    HireSmart<tspan fill="#67e8f9"> AI</tspan>
  </text>

  <text x="400" y="95"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="13" letter-spacing="3"
        fill="#94a3b8">
    INTELLIGENT RECRUITMENT PLATFORM
  </text>

  <path d="M260 112H540"
        stroke="url(#accent)"
        stroke-opacity=".65"/>

  <!-- Interface shadow -->

  <rect x="72" y="150"
        width="656" height="345"
        rx="18" fill="#000"
        opacity=".7" filter="url(#shadow)"/>

  <!-- Main application window -->

  <rect x="60" y="130"
        width="680" height="360"
        rx="17" fill="url(#metal)"
        stroke="#64748b"/>

  <rect x="65" y="135"
        width="670" height="350"
        rx="13" fill="#0b1323"/>

  <!-- Browser header -->

  <path d="M78 135H722Q735 135 735 148
           V170H65V148Q65 135 78 135Z"
        fill="#1e293b"/>

  <circle cx="85" cy="152" r="4" fill="#f87171"/>
  <circle cx="100" cy="152" r="4" fill="#fbbf24"/>
  <circle cx="115" cy="152" r="4" fill="#4ade80"/>

  <rect x="245" y="143"
        width="310" height="18"
        rx="6" fill="#0f172a"/>

  <text x="400" y="156"
        font-family="monospace"
        font-size="10"
        text-anchor="middle"
        fill="#94a3b8">
    HireSmart / AI Workspace
  </text>

  <!-- Sidebar -->

  <rect x="80" y="182"
        width="115" height="288"
        rx="8" fill="#131e32"/>

  <g font-family="Arial"
     font-size="11" text-anchor="middle">

    <rect x="90" y="198"
          width="95" height="29"
          rx="5" fill="#1c2a40"/>

    <text x="137" y="217"
          fill="#cbd5e1">Dashboard</text>

    <rect x="90" y="237"
          width="95" height="29"
          rx="5" fill="#1c2a40"/>

    <text x="137" y="256"
          fill="#cbd5e1">Candidates</text>

    <rect x="90" y="276"
          width="95" height="29"
          rx="5" fill="#164e63"
          stroke="#22d3ee"/>

    <text x="137" y="295"
          fill="#67e8f9">Resume AI</text>

    <rect x="90" y="315"
          width="95" height="29"
          rx="5" fill="#1c2a40"/>

    <text x="137" y="334"
          fill="#cbd5e1">Skill Gap</text>

    <rect x="90" y="354"
          width="95" height="29"
          rx="5" fill="#1c2a40"/>

    <text x="137" y="373"
          fill="#cbd5e1">Job Matching</text>

  </g>

  <!-- AI module indicator -->

  <circle cx="100" cy="445"
          r="4" fill="#4ade80"
          filter="url(#glow)">

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="3s" repeatCount="indefinite"/>

  </circle>

  <text x="112" y="449"
        font-family="monospace"
        font-size="10"
        fill="#86efac">AI Module</text>

  <!-- Resume analysis panel -->

  <rect x="210" y="182"
        width="235" height="288"
        rx="10" fill="url(#panel)"
        stroke="#334155"/>

  <text x="327" y="210"
        font-family="Arial"
        font-size="16" font-weight="bold"
        text-anchor="middle"
        fill="#67e8f9">
    AI Resume Analysis
  </text>

  <!-- Resume document -->

  <rect x="268" y="237"
        width="130" height="210"
        rx="7" fill="#000" opacity=".25"/>

  <rect x="263" y="232"
        width="130" height="210"
        rx="7" fill="url(#paper)"/>

  <circle cx="289" cy="259"
          r="14" fill="#64748b"/>

  <circle cx="289" cy="255"
          r="5" fill="#e2e8f0"/>

  <path d="M279 268Q289 256 299 268"
        fill="#e2e8f0"/>

  <rect x="311" y="249"
        width="65" height="5"
        rx="2" fill="#334155"/>

  <rect x="311" y="261"
        width="45" height="4"
        rx="2" fill="#94a3b8"/>

  <g fill="#94a3b8">

    <rect x="275" y="286" width="105" height="4" rx="2"/>
    <rect x="275" y="298" width="90" height="4" rx="2"/>
    <rect x="275" y="310" width="105" height="4" rx="2"/>
    <rect x="275" y="322" width="75" height="4" rx="2"/>

    <rect x="275" y="350" width="105" height="4" rx="2"/>
    <rect x="275" y="362" width="90" height="4" rx="2"/>
    <rect x="275" y="374" width="100" height="4" rx="2"/>

    <rect x="275" y="402" width="105" height="4" rx="2"/>
    <rect x="275" y="414" width="85" height="4" rx="2"/>

  </g>

  <g fill="#2563eb">

    <rect x="275" y="278"
          width="48" height="4" rx="2"/>

    <rect x="275" y="340"
          width="55" height="4" rx="2"/>

    <rect x="275" y="392"
          width="60" height="4" rx="2"/>

  </g>

  <!-- Animated resume scanning -->

  <g clip-path="url(#resumeClip)">

    <g>

      <rect x="263" y="190"
            width="130" height="44"
            fill="url(#scan)"/>

      <path d="M263 234H393"
            stroke="#22d3ee"
            stroke-width="3"
            filter="url(#glow)"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 208;0 0"
                        dur="7s"
                        repeatCount="indefinite"/>

    </g>

  </g>

  <!-- Resume scanning corners -->

  <g fill="none" stroke="#22d3ee"
     stroke-width="2.5" stroke-linecap="round">

    <path d="M254 247V224H277"/>
    <path d="M379 224H402V247"/>
    <path d="M254 427V450H277"/>
    <path d="M379 450H402V427"/>

    <animate attributeName="opacity"
             values=".4;1;.4"
             dur="4s" repeatCount="indefinite"/>

  </g>

  <!-- Candidate matching panel -->

  <rect x="460" y="182"
        width="260" height="138"
        rx="10" fill="url(#panel)"
        stroke="#334155"/>

  <text x="590" y="207"
        font-family="Arial"
        font-size="15" font-weight="bold"
        text-anchor="middle"
        fill="#e2e8f0">
    Candidate Matching
  </text>

  <g transform="translate(590 263)">

    <circle r="41"
            fill="#0b1528"
            stroke="#334155"
            stroke-width="8"/>

    <circle r="41"
            fill="none"
            stroke="url(#accent)"
            stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="205 258"
            transform="rotate(-90)"
            filter="url(#glow)">

      <animate attributeName="stroke-dasharray"
               values="45 258;205 258;205 258;45 258"
               dur="9s" repeatCount="indefinite"/>

    </circle>

    <text y="8"
          font-family="Arial"
          font-size="25" font-weight="bold"
          text-anchor="middle"
          fill="#67e8f9">AI</text>

  </g>

  <!-- Skill analysis panel -->

  <rect x="460" y="332"
        width="260" height="138"
        rx="10" fill="url(#panel)"
        stroke="#334155"/>

  <text x="478" y="356"
        font-family="Arial"
        font-size="15" font-weight="bold"
        fill="#e2e8f0">Skill Analysis</text>

  <g font-family="Arial"
     font-size="12" fill="#cbd5e1">

    <text x="478" y="381">Python</text>
    <text x="478" y="411">Django</text>
    <text x="478" y="441">SQL</text>

  </g>

  <g fill="#334155">

    <rect x="540" y="372"
          width="160" height="9" rx="4"/>

    <rect x="540" y="402"
          width="160" height="9" rx="4"/>

    <rect x="540" y="432"
          width="160" height="9" rx="4"/>

  </g>

  <g fill="url(#accent)">

    <rect x="540" y="372"
          width="145" height="9" rx="4">

      <animate attributeName="width"
               values="30;145;145;30"
               dur="8s" repeatCount="indefinite"/>

    </rect>

    <rect x="540" y="402"
          width="123" height="9" rx="4">

      <animate attributeName="width"
               values="20;123;123;20"
               dur="8s" repeatCount="indefinite"/>

    </rect>

    <rect x="540" y="432"
          width="100" height="9" rx="4">

      <animate attributeName="width"
               values="15;100;100;15"
               dur="8s" repeatCount="indefinite"/>

    </rect>

  </g>

  <!-- Animated metallic window edge -->

  <path d="M78 490H722"
        stroke="url(#accent)"
        stroke-width="3"
        filter="url(#glow)">

    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="6s" repeatCount="indefinite"/>

  </path>

  <!-- Technology badges -->

  <g font-family="Arial"
     font-size="14" font-weight="bold"
     text-anchor="middle">

    <rect x="88" y="515"
          width="140" height="34"
          rx="8" fill="#142b46"
          stroke="#3776ab"/>

    <text x="158" y="537"
          fill="#93c5fd">Python</text>

    <rect x="248" y="515"
          width="140" height="34"
          rx="8" fill="#10352c"
          stroke="#34d399"/>

    <text x="318" y="537"
          fill="#86efac">Django</text>

    <rect x="408" y="515"
          width="140" height="34"
          rx="8" fill="#103143"
          stroke="#22d3ee"/>

    <text x="478" y="537"
          fill="#67e8f9">React.js</text>

    <rect x="568" y="515"
          width="144" height="34"
          rx="8" fill="#192e4c"
          stroke="#60a5fa"/>

    <text x="640" y="537"
          fill="#93c5fd">PostgreSQL</text>

  </g>

  <!-- Footer branding -->

  <text x="400" y="580"
        font-family="Arial,sans-serif"
        font-size="12" letter-spacing="3"
        text-anchor="middle"
        fill="#94a3b8">
    ENGINEERED FOR INTELLIGENT HIRING
  </text>

</svg>
