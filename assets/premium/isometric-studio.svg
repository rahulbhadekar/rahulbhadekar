
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600"
     viewBox="0 0 800 600">

  <defs>

    <linearGradient id="platform" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#334155"/>
      <stop offset=".5" stop-color="#172033"/>
      <stop offset="1" stop-color="#080d19"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#64748b"/>
      <stop offset=".35" stop-color="#334155"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>

    <linearGradient id="cyan">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="purple">
      <stop stop-color="#6366f1"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="screen" x2="1" y2="1">
      <stop stop-color="#122749"/>
      <stop offset="1" stop-color="#050913"/>
    </linearGradient>

    <linearGradient id="jacket" x2="1" y2="1">
      <stop stop-color="#64748b"/>
      <stop offset=".35" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>

    <radialGradient id="ambient">
      <stop stop-color="#2563eb" stop-opacity=".3"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="head" cx=".3" cy=".2" r=".9">
      <stop stop-color="#d5ad91"/>
      <stop offset="1" stop-color="#8b5e49"/>
    </radialGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <pattern id="grid" width="25" height="25"
             patternUnits="userSpaceOnUse">
      <path d="M25 0H0V25" fill="none"
            stroke="#64748b" stroke-opacity=".14"/>
    </pattern>

  </defs>

  <!-- Ambient environment -->

  <ellipse cx="400" cy="300" rx="380" ry="280"
           fill="url(#ambient)"/>

  <ellipse cx="400" cy="545" rx="280" ry="30"
           fill="#000000" opacity=".4"
           filter="url(#shadow)"/>

  <!-- Floating platform -->

  <g>

    <path d="M65 395L445 250L750 390L370 550Z"
          fill="url(#platform)" stroke="#475569"/>

    <path d="M65 395L370 550V570L65 415Z"
          fill="#101827"/>

    <path d="M370 550L750 390V410L370 570Z"
          fill="#080d18"/>

    <path d="M65 395L445 250L750 390L370 550Z"
          fill="url(#grid)"/>

    <path d="M65 415L370 570L750 410"
          fill="none" stroke="url(#cyan)"
          stroke-width="3" filter="url(#glow)">

      <animate attributeName="opacity"
               values=".45;1;.45"
               dur="6s" repeatCount="indefinite"/>

    </path>

  </g>

  <!-- Desk legs -->

  <g fill="url(#metal)">

    <path d="M177 290L197 298V425L177 417Z"/>
    <path d="M585 250L605 258V380L585 372Z"/>
    <path d="M355 367L375 375V480L355 472Z"/>

  </g>

  <!-- Metallic desktop -->

  <path d="M150 270L475 155L655 240L330 370Z"
        fill="url(#metal)" stroke="#64748b"/>

  <path d="M150 270L330 370V385L150 285Z"
        fill="#172033"/>

  <path d="M330 370L655 240V255L330 385Z"
        fill="#0b1220"/>

  <path d="M150 285L330 385L655 255"
        fill="none" stroke="url(#purple)"
        stroke-width="3" filter="url(#glow)"/>

  <!-- Monitor stands -->

  <path d="M303 225V285L270 297L318 310L353 297L321 285V225Z"
        fill="url(#metal)"/>

  <path d="M505 175V236L475 248L520 260L550 248L523 236V175Z"
        fill="url(#metal)"/>

  <!-- Main coding monitor -->

  <g transform="translate(195 115) skewY(-15)">

    <rect width="235" height="165" rx="10"
          fill="#0b1220" stroke="#64748b" stroke-width="3"/>

    <rect x="9" y="9" width="217" height="147" rx="5"
          fill="url(#screen)"/>

    <rect x="9" y="9" width="217" height="22"
          fill="#1e293b"/>

    <circle cx="21" cy="20" r="3" fill="#f87171"/>
    <circle cx="32" cy="20" r="3" fill="#fbbf24"/>
    <circle cx="43" cy="20" r="3" fill="#4ade80"/>

    <text x="120" y="24" font-size="10"
          font-family="monospace"
          text-anchor="middle" fill="#94a3b8">
      intelligence.py
    </text>

    <g font-family="monospace" font-size="11">

      <text x="20" y="50" fill="#c084fc">
        import intelligence
      </text>

      <text x="20" y="70" fill="#67e8f9">
        class Developer:
      </text>

      <text x="32" y="90" fill="#fbbf24">
        def build(self):
      </text>

      <text x="44" y="110" fill="#86efac">
        return innovation
      </text>

      <text x="20" y="135" fill="#64748b">
        # RahulTechNotes
      </text>

      <rect x="143" y="125" width="6" height="13"
            fill="#67e8f9">

        <animate attributeName="opacity"
                 values="1;0;1"
                 dur="1.5s" repeatCount="indefinite"/>

      </rect>

    </g>

    <!-- Screen reflection -->

    <path d="M10 32H225L10 120Z"
          fill="#ffffff" opacity=".025"/>

  </g>

  <!-- AI monitor -->

  <g transform="translate(445 85) skewY(-15)">

    <rect width="190" height="150" rx="10"
          fill="#0b1220" stroke="#64748b" stroke-width="3"/>

    <rect x="8" y="8" width="174" height="134" rx="5"
          fill="url(#screen)"/>

    <text x="95" y="25" font-family="monospace"
          font-size="10" text-anchor="middle"
          fill="#a5b4fc">
      NEURAL ENGINE
    </text>

    <g transform="translate(95 82)">

      <circle r="39" fill="#172554"
              stroke="#60a5fa"/>

      <g fill="none" stroke="#818cf8" stroke-width="1.5">

        <ellipse rx="60" ry="17" transform="rotate(0)"/>
        <ellipse rx="60" ry="17" transform="rotate(60)"/>
        <ellipse rx="60" ry="17" transform="rotate(120)"/>

        <animateTransform attributeName="transform"
                          type="rotate"
                          from="0" to="360"
                          dur="24s" repeatCount="indefinite"/>

      </g>

      <circle r="23" fill="#0f172a"
              stroke="#67e8f9"/>

      <text y="9" font-size="26" font-weight="bold"
            font-family="Arial" text-anchor="middle"
            fill="#67e8f9" filter="url(#glow)">AI</text>

      <g>
        <circle cx="58" r="4" fill="#67e8f9"/>

        <animateTransform attributeName="transform"
                          type="rotate"
                          from="0" to="360"
                          dur="8s" repeatCount="indefinite"/>
      </g>

    </g>

  </g>

  <!-- Keyboard -->

  <g transform="translate(320 310) rotate(-21)">

    <rect width="160" height="44" rx="7"
          fill="#080d18" stroke="#64748b"/>

    <g stroke="url(#cyan)" stroke-width="3"
       stroke-dasharray="8 4">

      <path d="M10 10H150"/>
      <path d="M10 20H150"/>
      <path d="M10 30H150"/>

      <animate attributeName="opacity"
               values=".45;1;.45"
               dur="3s" repeatCount="indefinite"/>

    </g>

  </g>

  <!-- Mouse -->

  <ellipse cx="515" cy="284" rx="15" ry="10"
           transform="rotate(-20 515 284)"
           fill="#101827" stroke="#818cf8"/>

  <!-- Coffee mug -->

  <g transform="translate(215 275)">

    <rect width="28" height="34" rx="6"
          fill="#cbd5e1"/>

    <ellipse cx="14" cy="0" rx="14" ry="5"
             fill="#75513a"/>

    <path d="M28 7Q47 5 38 23H28"
          fill="none" stroke="#cbd5e1"
          stroke-width="5"/>

    <path d="M10 -10Q0 -24 13 -35Q25 -48 13 -60"
          stroke="#e2e8f0" stroke-width="2"
          fill="none">

      <animate attributeName="opacity"
               values="0;.7;0"
               dur="5s" repeatCount="indefinite"/>

    </path>

  </g>

  <!-- PC tower -->

  <g transform="translate(580 300)">

    <path d="M0 0L55 -22L100 0L45 24Z"
          fill="#475569"/>

    <path d="M0 0L45 24V154L0 130Z"
          fill="#1e293b"/>

    <path d="M45 24L100 0V130L45 154Z"
          fill="#080e19" stroke="#334155"/>

    <g transform="translate(72 43) skewY(-22)">

      <g fill="#172554" stroke="#60a5fa">
        <circle r="18"/>
        <circle cy="40" r="18"/>
        <circle cy="80" r="18"/>
      </g>

      <g fill="none" stroke="#a78bfa"
         stroke-width="3" filter="url(#glow)">

        <circle r="13" stroke-dasharray="14 7">
          <animateTransform attributeName="transform"
                            type="rotate"
                            from="0" to="360"
                            dur="3s" repeatCount="indefinite"/>
        </circle>

        <circle cy="40" r="13" stroke-dasharray="14 7">
          <animateTransform attributeName="transform"
                            type="rotate"
                            from="0 0 40" to="360 0 40"
                            dur="3s" repeatCount="indefinite"/>
        </circle>

        <circle cy="80" r="13" stroke-dasharray="14 7">
          <animateTransform attributeName="transform"
                            type="rotate"
                            from="0 0 80" to="360 0 80"
                            dur="3s" repeatCount="indefinite"/>
        </circle>

      </g>

    </g>

  </g>

  <!-- Seated developer legs -->

  <path d="M350 415Q390 398 430 402L465 444L445 461L397 430Z"
        fill="#1e293b"/>

  <path d="M445 452L465 445L484 478L463 486Z"
        fill="#101827"/>

  <!-- Developer arms -->

  <path d="M315 321Q350 310 373 329L404 315"
        fill="none" stroke="#334155"
        stroke-width="26" stroke-linecap="round"/>

  <g>

    <path d="M404 315L433 305"
          stroke="#b68b71" stroke-width="13"
          stroke-linecap="round"/>

    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 0;3 -2;0 0"
                      dur="1.6s" repeatCount="indefinite"/>

  </g>

  <!-- Developer torso -->

  <path d="M290 335Q288 295 325 278
           Q360 263 387 298
           Q411 340 400 415
           L300 440Q280 389 290 335Z"
        fill="url(#jacket)" stroke="#475569"/>

  <path d="M315 305Q339 328 365 301"
        fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- Neck -->

  <rect x="327" y="258" width="35" height="39"
        rx="10" fill="url(#head)"/>

  <!-- Rear-view head -->

  <ellipse cx="344" cy="232" rx="39" ry="47"
           fill="url(#head)"/>

  <path d="M305 244Q286 200 322 181
           Q365 164 384 204
           Q391 230 369 261
           L319 261Z"
        fill="#111827"/>

  <path d="M313 199Q339 181 367 202"
        stroke="#475569" stroke-width="4"
        fill="none" opacity=".7"/>

  <!-- Premium headphones -->

  <path d="M303 233Q288 176 345 174
           Q395 176 388 233"
        stroke="#334155" stroke-width="11"
        fill="none"/>

  <rect x="293" y="222" width="25" height="44"
        rx="11" fill="#111827"
        stroke="#67e8f9" stroke-width="2"/>

  <rect x="372" y="219" width="22" height="42"
        rx="10" fill="#111827"
        stroke="#818cf8" stroke-width="2"/>

  <!-- Ergonomic chair -->

  <path d="M270 332Q310 308 357 337
           L369 435Q323 461 281 436Z"
        fill="url(#metal)" stroke="#64748b"/>

  <path d="M285 348L296 425"
        stroke="#67e8f9" stroke-width="3"
        filter="url(#glow)"/>

  <path d="M345 350L355 426"
        stroke="#a78bfa" stroke-width="3"
        filter="url(#glow)"/>

  <path d="M292 438L370 425L404 445L325 464Z"
        fill="#172033"/>

  <path d="M325 460V495"
        stroke="#64748b" stroke-width="10"/>

  <path d="M325 490L280 510M325 490L375 510M325 490L340 525"
        stroke="#334155" stroke-width="9"
        stroke-linecap="round"/>

  <g fill="#111827" stroke="#64748b">
    <circle cx="280" cy="513" r="8"/>
    <circle cx="375" cy="513" r="8"/>
    <circle cx="340" cy="528" r="8"/>
  </g>

  <!-- Floating Python symbol -->

  <g transform="translate(100 125)">

    <g>

      <rect width="78" height="78" rx="19"
            fill="#12213a" stroke="#60a5fa"/>

      <path d="M38 13H51Q61 13 61 25V38H36V47H22
               Q13 47 13 36V27Q13 20 24 20H38Z"
            fill="#3776ab"/>

      <path d="M40 65H27Q17 65 17 53V40H42V31H56
               Q65 31 65 42V51Q65 58 54 58H40Z"
            fill="#ffd343"/>

      <circle cx="49" cy="23" r="3" fill="#fff"/>
      <circle cx="29" cy="55" r="3" fill="#fff"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -10;0 0"
                        dur="5s" repeatCount="indefinite"/>

    </g>

  </g>

  <!-- Floating terminal symbol -->

  <g transform="translate(665 135)">

    <g>

      <rect width="80" height="65" rx="14"
            fill="#101827" stroke="#818cf8"/>

      <path d="M20 19L34 32L20 45M42 45H62"
            stroke="#67e8f9" stroke-width="4"
            stroke-linecap="round" fill="none"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -12;0 0"
                        dur="6s" repeatCount="indefinite"/>

    </g>

  </g>

  <!-- Floating particles -->

  <g fill="#67e8f9">

    <circle cx="70" cy="270" r="3">
      <animate attributeName="opacity"
               values=".1;1;.1" dur="4s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="720" cy="280" r="3">
      <animate attributeName="opacity"
               values="1;.1;1" dur="5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="400" cy="55" r="3">
      <animate attributeName="opacity"
               values=".1;1;.1" dur="3s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <!-- Minimal branding -->

  <text x="400" y="595"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="12" letter-spacing="4"
        fill="#94a3b8">
    RAHULTECHNOTES
  </text>

</svg>
