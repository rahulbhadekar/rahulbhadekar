
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360"
     viewBox="0 0 1200 360"
     preserveAspectRatio="xMidYMid meet">

  <title>Rahul OS 2.0 - Cinematic Signature</title>

  <defs>

    <radialGradient id="bg">
      <stop stop-color="#1c2945"/>
      <stop offset=".5" stop-color="#101827"/>
      <stop offset="1" stop-color="#04070e"/>
    </radialGradient>

    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#e2e8f0"/>
      <stop offset=".5" stop-color="#94a3b8"/>
      <stop offset=".7" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="accent">
      <stop stop-color="#22d3ee"/>
      <stop offset=".35" stop-color="#60a5fa"/>
      <stop offset=".7" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="aurora">
      <stop stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset=".25" stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#6366f1"/>
      <stop offset=".75" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="reflection">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="6"
                    stdDeviation="6"
                    flood-color="#000000"
                    flood-opacity=".8"/>
    </filter>

    <clipPath id="frame">
      <rect width="1200" height="360" rx="20"/>
    </clipPath>

    <clipPath id="signatureClip">

      <text x="600" y="155"
            font-family="Georgia,serif"
            font-size="82"
            font-style="italic"
            text-anchor="middle">
        Rahul Bhadekar
      </text>

    </clipPath>

  </defs>

  <!-- Cinematic background -->

  <rect width="1200" height="360"
        rx="20" fill="url(#bg)"/>

  <g clip-path="url(#frame)">

    <!-- Ambient lighting -->

    <ellipse cx="250" cy="220"
             rx="280" ry="100"
             fill="#0891b2"
             opacity=".08"
             filter="url(#softGlow)">

      <animate attributeName="opacity"
               values=".04;.15;.04"
               dur="12s"
               repeatCount="indefinite"/>

    </ellipse>

    <ellipse cx="950" cy="200"
             rx="280" ry="100"
             fill="#7c3aed"
             opacity=".1"
             filter="url(#softGlow)">

      <animate attributeName="opacity"
               values=".05;.17;.05"
               dur="14s"
               repeatCount="indefinite"/>

    </ellipse>

    <!-- Cinematic aurora waves -->

    <g fill="none"
       stroke="url(#aurora)"
       stroke-width="1.5">

      <path d="M-100 260Q200 30 600 230T1300 130"
            opacity=".2"/>

      <path d="M-100 270Q200 45 600 240T1300 140"
            opacity=".22"/>

      <path d="M-100 280Q200 60 600 250T1300 150"
            opacity=".24"/>

      <path d="M-100 290Q200 75 600 260T1300 160"
            opacity=".26"/>

      <path d="M-100 300Q200 90 600 270T1300 170"
            opacity=".28"/>

      <path d="M-100 310Q200 105 600 280T1300 180"
            opacity=".26"/>

      <path d="M-100 320Q200 120 600 290T1300 190"
            opacity=".24"/>

      <path d="M-100 330Q200 135 600 300T1300 200"
            opacity=".22"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -22;0 0"
                        dur="15s"
                        repeatCount="indefinite"/>

    </g>

    <!-- Secondary aurora layer -->

    <g fill="none"
       stroke="url(#aurora)"
       stroke-width="2"
       opacity=".12"
       filter="url(#glow)">

      <path d="M-100 310Q300 100 600 260T1300 190"/>
      <path d="M-100 330Q300 120 600 280T1300 210"/>
      <path d="M-100 350Q300 140 600 300T1300 230"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 15;0 0"
                        dur="18s"
                        repeatCount="indefinite"/>

    </g>

    <!-- Floating cinematic particles -->

    <g fill="#67e8f9" filter="url(#glow)">

      <circle cx="110" cy="80" r="2.5">
        <animate attributeName="opacity"
                 values=".1;1;.1"
                 dur="5s" repeatCount="indefinite"/>
      </circle>

      <circle cx="230" cy="260" r="2">
        <animate attributeName="opacity"
                 values="1;.1;1"
                 dur="7s" repeatCount="indefinite"/>
      </circle>

      <circle cx="370" cy="45" r="2">
        <animate attributeName="opacity"
                 values=".2;1;.2"
                 dur="6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="850" cy="65" r="2.5">
        <animate attributeName="opacity"
                 values=".1;1;.1"
                 dur="8s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1060" cy="250" r="2">
        <animate attributeName="opacity"
                 values="1;.1;1"
                 dur="6s" repeatCount="indefinite"/>
      </circle>

      <circle cx="1120" cy="95" r="2">
        <animate attributeName="opacity"
                 values=".1;1;.1"
                 dur="5s" repeatCount="indefinite"/>
      </circle>

    </g>

    <!-- Moving light particles -->

    <circle r="3" fill="#67e8f9"
            filter="url(#glow)">

      <animateMotion
        path="M0 260Q300 80 600 240T1200 140"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="3" fill="#c084fc"
            filter="url(#glow)">

      <animateMotion
        path="M1200 210Q900 340 600 260T0 310"
        dur="21s"
        repeatCount="indefinite"/>

    </circle>

    <!-- Operating system branding -->

    <text x="600" y="48"
          font-family="Arial,sans-serif"
          font-size="13"
          font-weight="bold"
          letter-spacing="7"
          text-anchor="middle"
          fill="#94a3b8">
      RAHUL OS 2.0
    </text>

    <path d="M480 64H720"
          stroke="url(#accent)"
          stroke-opacity=".4"/>

    <!-- Metallic signature -->

    <text x="600" y="155"
          font-family="Georgia,serif"
          font-size="82"
          font-style="italic"
          text-anchor="middle"
          fill="url(#silver)"
          filter="url(#shadow)">
      Rahul Bhadekar
    </text>

    <!-- Signature light reflection -->

    <g clip-path="url(#signatureClip)">

      <rect x="-200" y="65"
            width="150" height="120"
            fill="url(#reflection)"
            transform="skewX(-18)">

        <animate attributeName="x"
                 values="-200;-200;1500;1500"
                 keyTimes="0;.25;.65;1"
                 dur="12s"
                 repeatCount="indefinite"/>

      </rect>

    </g>

    <!-- Signature underline -->

    <path d="M350 174Q570 205 860 164"
          fill="none"
          stroke="#334155"
          stroke-width="2"/>

    <path d="M350 174Q570 205 860 164"
          fill="none"
          stroke="url(#accent)"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-dasharray="550"
          filter="url(#glow)">

      <animate attributeName="stroke-dashoffset"
               values="550;0;0;550"
               keyTimes="0;.25;.85;1"
               dur="12s"
               repeatCount="indefinite"/>

    </path>

    <!-- Professional identity -->

    <text x="600" y="214"
          font-family="Arial,sans-serif"
          font-size="14"
          letter-spacing="3"
          text-anchor="middle"
          fill="#94a3b8">
      AI ENGINEER &#8226; PYTHON &#8226; FULL STACK
    </text>

    <!-- Motivational quote -->

    <text x="600" y="250"
          font-family="Georgia,serif"
          font-size="23"
          font-style="italic"
          text-anchor="middle"
          fill="#e2e8f0">
      The future is built, not predicted.
    </text>

    <!-- RahulTechNotes branding -->

    <text x="600" y="302"
          font-family="Arial,sans-serif"
          font-size="28"
          font-weight="800"
          text-anchor="middle"
          fill="url(#silver)">
      Rahul<tspan fill="url(#accent)">TechNotes</tspan>
    </text>

    <text x="600" y="326"
          font-family="Arial,sans-serif"
          font-size="11"
          font-weight="bold"
          letter-spacing="5"
          text-anchor="middle"
          fill="#94a3b8">
      LEARN &#8226; CODE &#8226; GROW
    </text>

    <!-- Animated bottom edge -->

    <rect y="357"
          width="1200" height="3"
          fill="url(#accent)"
          opacity=".5"/>

    <rect x="-300" y="356"
          width="300" height="4"
          fill="url(#reflection)"
          filter="url(#glow)">

      <animate attributeName="x"
               from="-300"
               to="1500"
               dur="9s"
               repeatCount="indefinite"/>

    </rect>

  </g>

</svg>
