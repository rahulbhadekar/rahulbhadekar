
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="460"
     viewBox="0 0 800 460"
     preserveAspectRatio="xMidYMid meet">

  <title>RahulTechNotes - Knowledge Studio</title>

  <defs>

    <radialGradient id="bg">
      <stop stop-color="#253454"/>
      <stop offset=".5" stop-color="#141e33"/>
      <stop offset="1" stop-color="#060b14"/>
    </radialGradient>

    <linearGradient id="silver" x2="0" y2="1">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="accent">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="python" x2="1" y2="1">
      <stop stop-color="#3b82f6"/>
      <stop offset=".5" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="java" x2="1" y2="1">
      <stop stop-color="#f97316"/>
      <stop offset=".5" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#431407"/>
    </linearGradient>

    <linearGradient id="sql" x2="1" y2="1">
      <stop stop-color="#10b981"/>
      <stop offset=".5" stop-color="#047857"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>

    <linearGradient id="ai" x2="1" y2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset=".5" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>

    <linearGradient id="paper">
      <stop stop-color="#f8fafc"/>
      <stop offset=".5" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="shine">
      <stop stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <pattern id="grid" width="30" height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30"
            stroke="#94a3b8"
            stroke-opacity=".045"
            fill="none"/>
    </pattern>

    <clipPath id="coverClip">
      <rect width="130" height="210" rx="5"/>
    </clipPath>

    <!-- Reusable 3D book structure -->

    <g id="bookPages">

      <path d="M0 0L130 0L145 -10L15 -10Z"
            fill="#e2e8f0"/>

      <path d="M130 0L145 -10V200L130 210Z"
            fill="url(#paper)"/>

      <g stroke="#64748b"
         stroke-width=".7" opacity=".6">

        <path d="M133 -2V208"/>
        <path d="M136 -4V206"/>
        <path d="M139 -6V204"/>
        <path d="M142 -8V202"/>

      </g>

      <path d="M130 0L145 -10V-5L130 5Z"
            fill="#334155"/>

      <path d="M130 205L145 195V200L130 210Z"
            fill="#334155"/>

    </g>

    <!-- Reusable premium book cover details -->

    <g id="coverDetails">

      <rect width="10" height="210"
            rx="3" fill="#000" opacity=".3"/>

      <rect x="12" y="4"
            width="2" height="202"
            fill="#ffffff" opacity=".12"/>

      <rect x="20" y="17"
            width="94" height="176"
            rx="3" fill="none"
            stroke="#ffffff"
            stroke-opacity=".25"/>

      <path d="M30 65H104M30 153H104"
            stroke="#ffffff"
            stroke-opacity=".25"/>

      <text x="67" y="174"
            font-family="Arial,sans-serif"
            font-size="9"
            letter-spacing="1"
            text-anchor="middle"
            fill="#e2e8f0">TECH NOTES</text>

      <text x="67" y="187"
            font-family="Arial,sans-serif"
            font-size="6"
            text-anchor="middle"
            fill="#cbd5e1">RAHULTECHNOTES</text>

    </g>

    <!-- Animated metallic reflection -->

    <g id="reflection"
       clip-path="url(#coverClip)">

      <rect x="-100" y="-30"
            width="55" height="290"
            fill="url(#shine)"
            transform="rotate(18)">

        <animate attributeName="x"
                 values="-100;-100;200;200"
                 keyTimes="0;.3;.7;1"
                 dur="9s"
                 repeatCount="indefinite"/>

      </rect>

    </g>

  </defs>

  <!-- Cinematic background -->

  <rect width="800" height="460"
        rx="22" fill="url(#bg)"/>

  <rect width="800" height="460"
        rx="22" fill="url(#grid)"/>

  <!-- Ambient light -->

  <ellipse cx="400" cy="240"
           rx="340" ry="155"
           fill="#2563eb"
           opacity=".06"
           filter="url(#shadow)"/>

  <!-- Main brand title -->

  <text x="400" y="55"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="39"
        font-weight="800"
        fill="url(#silver)">
    Rahul<tspan fill="url(#accent)">TechNotes</tspan>
  </text>

  <text x="400" y="82"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="12"
        font-weight="bold"
        letter-spacing="5"
        fill="#94a3b8">
    LEARN &#8226; CODE &#8226; GROW
  </text>

  <path d="M260 99H540"
        stroke="url(#accent)"
        stroke-opacity=".65"/>

  <!-- Floating platform shadow -->

  <ellipse cx="400" cy="354"
           rx="340" ry="30"
           fill="#000"
           opacity=".6"
           filter="url(#shadow)"/>

  <!-- Decorative orbital paths -->

  <ellipse cx="400" cy="270"
           rx="350" ry="100"
           fill="none"
           stroke="#64748b"
           stroke-opacity=".2"
           stroke-dasharray="4 10"/>

  <!-- PYTHON BOOK -->

  <g transform="translate(70 130) rotate(-8 65 100)">

    <g>

      <use href="#bookPages"/>

      <rect width="130" height="210"
            rx="5" fill="url(#python)"
            stroke="#93c5fd"/>

      <use href="#coverDetails"/>

      <text x="67" y="49"
            font-family="Arial"
            font-size="18"
            font-weight="bold"
            text-anchor="middle"
            fill="#ffffff">PYTHON</text>

      <circle cx="67" cy="109"
              r="33"
              fill="#0f172a"
              fill-opacity=".65"
              stroke="#93c5fd"/>

      <!-- Python inspired symbol -->

      <g transform="translate(43 79) scale(.52)">

        <path d="M45 0H65Q88 0 88 23V58H40V70H18
                 Q0 70 0 50V32Q0 15 20 15H45Z"
              fill="#60a5fa"/>

        <path d="M48 124H28Q5 124 5 101V66H53V54H75
                 Q93 54 93 74V92Q93 109 73 109H48Z"
              fill="#facc15"/>

        <circle cx="65" cy="15" r="6" fill="#fff"/>
        <circle cx="28" cy="109" r="6" fill="#fff"/>

      </g>

      <use href="#reflection"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -9;0 0"
                        dur="6s"
                        repeatCount="indefinite"/>

    </g>

  </g>

  <!-- JAVA BOOK -->

  <g transform="translate(245 130) rotate(-3 65 100)">

    <g>

      <use href="#bookPages"/>

      <rect width="130" height="210"
            rx="5" fill="url(#java)"
            stroke="#fdba74"/>

      <use href="#coverDetails"/>

      <text x="67" y="49"
            font-family="Arial"
            font-size="20"
            font-weight="bold"
            text-anchor="middle"
            fill="#ffffff">JAVA</text>

      <circle cx="67" cy="109"
              r="33"
              fill="#1c1917"
              fill-opacity=".65"
              stroke="#fdba74"/>

      <!-- Java inspired coffee symbol -->

      <g transform="translate(67 111)">

        <path d="M-20 -3H14L10 12
                 Q-3 24 -15 12Z"
              fill="none"
              stroke="#fed7aa"
              stroke-width="3"/>

        <path d="M14 0Q29 -3 24 8L12 12"
              fill="none"
              stroke="#fed7aa"
              stroke-width="3"/>

        <path d="M-25 22Q0 30 25 22"
              fill="none"
              stroke="#93c5fd"
              stroke-width="3"/>

        <g fill="none"
           stroke="#fdba74"
           stroke-width="2.5">

          <path d="M-7 -9Q-18 -19 -3 -27"/>
          <path d="M5 -9Q-5 -18 10 -29"/>

          <animate attributeName="opacity"
                   values=".3;1;.3"
                   dur="4s"
                   repeatCount="indefinite"/>

        </g>

      </g>

      <use href="#reflection"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 -5;0 4;0 -5"
                        dur="7s"
                        repeatCount="indefinite"/>

    </g>

  </g>

  <!-- SQL BOOK -->

  <g transform="translate(420 130) rotate(3 65 100)">

    <g>

      <use href="#bookPages"/>

      <rect width="130" height="210"
            rx="5" fill="url(#sql)"
            stroke="#6ee7b7"/>

      <use href="#coverDetails"/>

      <text x="67" y="49"
            font-family="Arial"
            font-size="20"
            font-weight="bold"
            text-anchor="middle"
            fill="#ffffff">SQL</text>

      <circle cx="67" cy="109"
              r="33"
              fill="#022c22"
              fill-opacity=".65"
              stroke="#6ee7b7"/>

      <!-- Database symbol -->

      <g transform="translate(67 108)">

        <path d="M-22 -17V17
                 Q0 32 22 17V-17Z"
              fill="#065f46"
              stroke="#a7f3d0"/>

        <ellipse cy="-17"
                 rx="22" ry="9"
                 fill="#34d399"
                 stroke="#a7f3d0"/>

        <path d="M-22 -5Q0 12 22 -5
                 M-22 6Q0 23 22 6"
              fill="none"
              stroke="#a7f3d0"
              stroke-width="2"/>

        <circle cx="13" cy="15"
                r="3"
                fill="#86efac"
                filter="url(#glow)">

          <animate attributeName="opacity"
                   values=".2;1;.2"
                   dur="3s"
                   repeatCount="indefinite"/>

        </circle>

      </g>

      <use href="#reflection"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -10;0 0"
                        dur="6.5s"
                        repeatCount="indefinite"/>

    </g>

  </g>

  <!-- ARTIFICIAL INTELLIGENCE BOOK -->

  <g transform="translate(595 130) rotate(8 65 100)">

    <g>

      <use href="#bookPages"/>

      <rect width="130" height="210"
            rx="5" fill="url(#ai)"
            stroke="#c4b5fd"/>

      <use href="#coverDetails"/>

      <text x="67" y="40"
            font-family="Arial"
            font-size="15"
            font-weight="bold"
            text-anchor="middle"
            fill="#ffffff">ARTIFICIAL</text>

      <text x="67" y="55"
            font-family="Arial"
            font-size="12"
            font-weight="bold"
            text-anchor="middle"
            fill="#e9d5ff">INTELLIGENCE</text>

      <circle cx="67" cy="109"
              r="33"
              fill="#2e1065"
              fill-opacity=".65"
              stroke="#c4b5fd"/>

      <!-- Neural network symbol -->

      <g transform="translate(67 109)">

        <g stroke="#c4b5fd"
           stroke-width="1.5"
           fill="none">

          <path d="M-21 -15L0 -23L21 -15"/>
          <path d="M-21 -15L0 0L21 15"/>
          <path d="M-21 15L0 -23L21 15"/>
          <path d="M-21 15L0 23L21 -15"/>
          <path d="M-21 15L0 0L21 15"/>

        </g>

        <g fill="#ddd6fe"
           filter="url(#glow)">

          <circle cx="-21" cy="-15" r="4"/>
          <circle cx="-21" cy="15" r="4"/>
          <circle cy="-23" r="4"/>
          <circle r="5"/>
          <circle cy="23" r="4"/>
          <circle cx="21" cy="-15" r="4"/>
          <circle cx="21" cy="15" r="4"/>

          <animate attributeName="opacity"
                   values=".4;1;.4"
                   dur="4s"
                   repeatCount="indefinite"/>

        </g>

      </g>

      <use href="#reflection"/>

      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 -4;0 5;0 -4"
                        dur="7.5s"
                        repeatCount="indefinite"/>

    </g>

  </g>

  <!-- Floating knowledge particles -->

  <g fill="#67e8f9"
     filter="url(#glow)">

    <circle r="3">

      <animateMotion
        path="M50 270 A350 100 0 1 1 750 270 A350 100 0 1 1 50 270"
        dur="24s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="3" fill="#a78bfa">

      <animateMotion
        path="M750 270 A350 100 0 1 1 50 270 A350 100 0 1 1 750 270"
        dur="24s"
        repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- Animated separator -->

  <path d="M230 388H570"
        stroke="#334155"/>

  <path d="M230 388H570"
        stroke="url(#accent)"
        stroke-width="2"
        stroke-dasharray="45 150"
        filter="url(#glow)">

    <animate attributeName="stroke-dashoffset"
             from="390"
             to="0"
             dur="8s"
             repeatCount="indefinite"/>

  </path>

  <!-- Knowledge studio message -->

  <text x="400" y="420"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="23"
        font-weight="bold"
        fill="url(#silver)">
    Knowledge Worth Sharing.
  </text>

  <text x="400" y="445"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="12"
        letter-spacing="3"
        fill="#67e8f9">
    #RahulTechNotes
  </text>

</svg>
