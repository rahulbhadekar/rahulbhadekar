
<svg xmlns="http://www.w3.org/2000/svg"
     width="800" height="600"
     viewBox="0 0 800 600"
     preserveAspectRatio="xMidYMid meet">

  <title>Revitalize - Waste Management System</title>

  <defs>

    <radialGradient id="bg">
      <stop stop-color="#174c37"/>
      <stop offset=".55" stop-color="#102b25"/>
      <stop offset="1" stop-color="#060e12"/>
    </radialGradient>

    <linearGradient id="green" x2="1" y2="1">
      <stop stop-color="#bbf7d0"/>
      <stop offset=".4" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="ground" x2="1" y2="1">
      <stop stop-color="#42764b"/>
      <stop offset=".5" stop-color="#23543b"/>
      <stop offset="1" stop-color="#123525"/>
    </linearGradient>

    <linearGradient id="building" x2="1" y2="1">
      <stop stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="glass" x2="1" y2="1">
      <stop stop-color="#67e8f9"/>
      <stop offset=".4" stop-color="#155e75"/>
      <stop offset="1" stop-color="#082f49"/>
    </linearGradient>

    <linearGradient id="tree" x2="1" y2="1">
      <stop stop-color="#86efac"/>
      <stop offset=".5" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#166534"/>
    </linearGradient>

    <radialGradient id="core">
      <stop stop-color="#164e36"/>
      <stop offset="1" stop-color="#071c15"/>
    </radialGradient>

    <filter id="glow" x="-100%" y="-100%"
            width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow">
      <feGaussianBlur stdDeviation="13"/>
    </filter>

    <pattern id="grid" width="30" height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30"
            stroke="#86efac"
            stroke-opacity=".045"
            fill="none"/>
    </pattern>

    <!-- Reusable three-dimensional tree -->

    <g id="treeModel">

      <ellipse cy="24" rx="24" ry="8"
               fill="#000" opacity=".2"/>

      <rect x="-5" y="-5"
            width="10" height="30"
            rx="3" fill="#79553a"/>

      <circle cy="-17" r="25"
              fill="url(#tree)"/>

      <circle cx="-10" cy="-26" r="15"
              fill="#4ade80" opacity=".7"/>

    </g>

    <!-- Reusable city building -->

    <g id="buildingModel">

      <path d="M0 0L60 0L82 -15L22 -15Z"
            fill="#f1f5f9"/>

      <rect width="60" height="110"
            fill="url(#building)"/>

      <path d="M60 0L82 -15V95L60 110Z"
            fill="#475569"/>

      <g fill="url(#glass)">

        <rect x="10" y="12" width="17" height="19" rx="2"/>
        <rect x="33" y="12" width="17" height="19" rx="2"/>

        <rect x="10" y="40" width="17" height="19" rx="2"/>
        <rect x="33" y="40" width="17" height="19" rx="2"/>

        <rect x="10" y="68" width="17" height="19" rx="2"/>
        <rect x="33" y="68" width="17" height="19" rx="2"/>

      </g>

      <rect x="22" y="91"
            width="17" height="19"
            fill="#1e293b"/>

    </g>

    <!-- Reusable recycling arrow -->

    <path id="recycleArrow"
          d="M-12 -66
             A67 67 0 0 1 59 -30
             L72 -39
             L65 2
             L27 -13
             L40 -21
             A45 45 0 0 0 -12 -44Z"
          fill="url(#green)"/>

  </defs>

  <!-- Cinematic background -->

  <rect width="800" height="600"
        rx="22" fill="url(#bg)"/>

  <rect width="800" height="600"
        rx="22" fill="url(#grid)"/>

  <!-- Project branding -->

  <text x="400" y="65"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="48"
        font-weight="800"
        fill="#f8fafc">
    Re<tspan fill="url(#green)">vitalize</tspan>
  </text>

  <text x="400" y="95"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="13"
        letter-spacing="3"
        fill="#a7f3d0">
    WASTE MANAGEMENT SYSTEM
  </text>

  <path d="M260 112H540"
        stroke="url(#green)"
        opacity=".6"/>

  <!-- Floating ecosystem shadow -->

  <ellipse cx="400" cy="510"
           rx="300" ry="28"
           fill="#000"
           opacity=".55"
           filter="url(#shadow)"/>

  <!-- Three-dimensional ecosystem platform -->

  <path d="M65 350L400 205L735 350L400 490Z"
        fill="url(#ground)"
        stroke="#4d7c55"/>

  <path d="M65 350L400 490V515L65 375Z"
        fill="#123525"/>

  <path d="M400 490L735 350V375L400 515Z"
        fill="#0b291e"/>

  <path d="M65 375L400 515L735 375"
        stroke="#4ade80"
        stroke-width="3"
        fill="none"
        filter="url(#glow)">

    <animate attributeName="opacity"
             values=".35;1;.35"
             dur="6s"
             repeatCount="indefinite"/>

  </path>

  <!-- Sustainable city pathways -->

  <path d="M110 350L400 230L690 350L400 470Z"
        fill="none"
        stroke="#a7f3d0"
        stroke-opacity=".2"
        stroke-width="16"/>

  <path d="M110 350L400 230L690 350L400 470Z"
        fill="none"
        stroke="#e2e8f0"
        stroke-opacity=".4"
        stroke-width="1.5"
        stroke-dasharray="7 10"/>

  <!-- City buildings -->

  <g transform="translate(140 240)">
    <use href="#buildingModel"/>
  </g>

  <g transform="translate(220 205) scale(.85 1.1)">
    <use href="#buildingModel"/>
  </g>

  <g transform="translate(540 230) scale(.95)">
    <use href="#buildingModel"/>
  </g>

  <!-- Solar energy panels -->

  <g transform="translate(120 365) skewY(22)">

    <path d="M0 0H90L105 45H15Z"
          fill="#172554"
          stroke="#93c5fd"
          stroke-width="2"/>

    <g stroke="#60a5fa"
       stroke-width="1"
       opacity=".7">

      <path d="M5 15H95M10 30H100"/>
      <path d="M22 0L37 45"/>
      <path d="M45 0L60 45"/>
      <path d="M68 0L83 45"/>

    </g>

    <path d="M8 5H88L95 25H15Z"
          fill="#93c5fd"
          opacity=".12"/>

    <path d="M35 45V58M80 45V58"
          stroke="#94a3b8"
          stroke-width="4"/>

  </g>

  <!-- Renewable wind energy -->

  <g transform="translate(650 245)">

    <path d="M-5 0L-9 100H9L5 0Z"
          fill="url(#building)"/>

    <g>

      <path d="M0 0L-8 -60L4 -69L7 -10Z"
            fill="#e2e8f0"/>

      <path d="M0 0L-8 -60L4 -69L7 -10Z"
            fill="#e2e8f0"
            transform="rotate(120)"/>

      <path d="M0 0L-8 -60L4 -69L7 -10Z"
            fill="#e2e8f0"
            transform="rotate(240)"/>

      <circle r="8"
              fill="#94a3b8"
              stroke="#e2e8f0"/>

      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0"
                        to="360"
                        dur="12s"
                        repeatCount="indefinite"/>

    </g>

  </g>

  <!-- Green trees -->

  <g transform="translate(105 340) scale(.85)">
    <use href="#treeModel"/>
  </g>

  <g transform="translate(245 410)">
    <use href="#treeModel"/>
  </g>

  <g transform="translate(580 405) scale(1.1)">
    <use href="#treeModel"/>
  </g>

  <g transform="translate(690 350) scale(.8)">
    <use href="#treeModel"/>
  </g>

  <g transform="translate(505 450) scale(.75)">
    <use href="#treeModel"/>
  </g>

  <!-- Recycling intelligence core -->

  <ellipse cx="400" cy="345"
           rx="90" ry="20"
           fill="#000"
           opacity=".45"
           filter="url(#shadow)"/>

  <g transform="translate(400 240)">

    <circle r="106"
            fill="#22c55e"
            opacity=".06">

      <animate attributeName="r"
               values="100;115;100"
               dur="6s"
               repeatCount="indefinite"/>

    </circle>

    <circle r="97"
            fill="none"
            stroke="#4ade80"
            stroke-width="2"
            stroke-dasharray="5 13"
            opacity=".6">

      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0"
                        to="360"
                        dur="30s"
                        repeatCount="indefinite"/>

    </circle>

    <circle r="83"
            fill="url(#core)"
            stroke="#4ade80"
            stroke-width="2"/>

    <circle r="74"
            fill="none"
            stroke="#86efac"
            stroke-opacity=".2"/>

    <!-- Animated recycling arrows -->

    <g filter="url(#glow)">

      <use href="#recycleArrow"/>

      <use href="#recycleArrow"
           transform="rotate(120)"/>

      <use href="#recycleArrow"
           transform="rotate(240)"/>

      <animateTransform attributeName="transform"
                        type="rotate"
                        from="0"
                        to="360"
                        dur="24s"
                        repeatCount="indefinite"/>

    </g>

    <circle r="20"
            fill="#103b27"
            stroke="#4ade80"/>

    <path d="M-10 8Q-17 -13 14 -16
             Q17 12 -10 8Z"
          fill="#86efac"/>

    <path d="M-12 13L8 -9"
          stroke="#166534"
          stroke-width="2"/>

  </g>

  <!-- Waste segregation bins -->

  <!-- Organic waste -->

  <g transform="translate(305 385)">

    <rect x="4" y="8"
          width="46" height="63"
          rx="7" fill="#15803d"/>

    <path d="M50 8L60 2V62L50 71Z"
          fill="#14532d"/>

    <rect width="54" height="13"
          rx="4" fill="#4ade80"/>

    <path d="M17 43Q10 22 38 21
             Q43 44 17 43Z"
          fill="#dcfce7"/>

    <path d="M15 49L33 28"
          stroke="#166534"
          stroke-width="2"/>

    <text x="27" y="60"
          text-anchor="middle"
          font-family="Arial"
          font-size="8"
          fill="#dcfce7">ORGANIC</text>

  </g>

  <!-- Recyclable waste -->

  <g transform="translate(375 385)">

    <rect x="4" y="8"
          width="46" height="63"
          rx="7" fill="#2563eb"/>

    <path d="M50 8L60 2V62L50 71Z"
          fill="#1e3a8a"/>

    <rect width="54" height="13"
          rx="4" fill="#60a5fa"/>

    <g transform="translate(27 34) scale(.2)">
      <use href="#recycleArrow"/>
      <use href="#recycleArrow"
           transform="rotate(120)"/>
      <use href="#recycleArrow"
           transform="rotate(240)"/>
    </g>

    <text x="27" y="60"
          text-anchor="middle"
          font-family="Arial"
          font-size="8"
          fill="#dbeafe">RECYCLE</text>

  </g>

  <!-- Other waste -->

  <g transform="translate(445 385)">

    <rect x="4" y="8"
          width="46" height="63"
          rx="7" fill="#d97706"/>

    <path d="M50 8L60 2V62L50 71Z"
          fill="#92400e"/>

    <rect width="54" height="13"
          rx="4" fill="#fbbf24"/>

    <rect x="17" y="24"
          width="20" height="23"
          rx="3" fill="#fef3c7"/>

    <path d="M14 23H40M23 19H31"
          stroke="#fef3c7"
          stroke-width="3"/>

    <text x="27" y="60"
          text-anchor="middle"
          font-family="Arial"
          font-size="8"
          fill="#fef3c7">OTHER</text>

  </g>

  <!-- Environmental data connections -->

  <g fill="none"
     stroke="#86efac"
     stroke-width="1.5"
     stroke-dasharray="5 8"
     opacity=".5">

    <path d="M200 330L300 355L400 330"/>
    <path d="M650 345L500 355L400 330"/>
    <path d="M400 330V380"/>

  </g>

  <g fill="#86efac"
     filter="url(#glow)">

    <circle r="4">

      <animateMotion
        path="M200 330L300 355L400 330"
        dur="5s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="4">

      <animateMotion
        path="M650 345L500 355L400 330"
        dur="6s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="4">

      <animateMotion
        path="M400 330V380"
        dur="3s"
        repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- Floating environmental particles -->

  <g fill="#86efac">

    <circle cx="80" cy="190" r="3">

      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="5s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="720" cy="180" r="3">

      <animate attributeName="opacity"
               values="1;.1;1"
               dur="6s"
               repeatCount="indefinite"/>

    </circle>

    <circle cx="510" cy="145" r="2">

      <animate attributeName="opacity"
               values=".1;1;.1"
               dur="4s"
               repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- Frontend technology badges -->

  <g font-family="Arial,sans-serif"
     font-size="15"
     font-weight="bold"
     text-anchor="middle">

    <rect x="110" y="535"
          width="180" height="32"
          rx="8" fill="#30251d"
          stroke="#f97316"/>

    <text x="200" y="556"
          fill="#fdba74">HTML5</text>

    <rect x="310" y="535"
          width="180" height="32"
          rx="8" fill="#142d45"
          stroke="#60a5fa"/>

    <text x="400" y="556"
          fill="#93c5fd">CSS3</text>

    <rect x="510" y="535"
          width="180" height="32"
          rx="8" fill="#302d18"
          stroke="#facc15"/>

    <text x="600" y="556"
          fill="#fde047">JavaScript</text>

  </g>

  <!-- Footer branding -->

  <text x="400" y="588"
        text-anchor="middle"
        font-family="Arial,sans-serif"
        font-size="11"
        letter-spacing="3"
        fill="#86efac">
    BUILDING A GREENER TOMORROW
  </text>

</svg>
