
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="740"
     viewBox="0 0 1200 740">

  <title>Living AI Intelligence Core</title>

  <defs>

    <radialGradient id="background">
      <stop offset="0%" stop-color="#15223E"/>
      <stop offset="55%" stop-color="#080E19"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <radialGradient id="sphere" cx="30%" cy="25%">
      <stop offset="0%" stop-color="#C7EAFF"/>
      <stop offset="18%" stop-color="#3975C6"/>
      <stop offset="45%" stop-color="#172F65"/>
      <stop offset="75%" stop-color="#080F25"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".4"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ring">
      <stop offset="0%" stop-color="#2563EB" stop-opacity=".1"/>
      <stop offset="35%" stop-color="#67E8F9"/>
      <stop offset="70%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity=".1"/>
    </linearGradient>

    <linearGradient id="metal" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <pattern id="stars" width="180" height="160"
             patternUnits="userSpaceOnUse">

      <circle cx="20" cy="30" r=".8"
              fill="#FFFFFF" opacity=".4"/>

      <circle cx="100" cy="70" r=".7"
              fill="#93C5FD" opacity=".5"/>

      <circle cx="155" cy="125" r="1"
              fill="#C4B5FD" opacity=".4"/>

    </pattern>

    <clipPath id="sphereClip">
      <circle r="155"/>
    </clipPath>

  </defs>

  <!-- CONTINUOUS OBSIDIAN BACKGROUND -->

  <rect width="1200" height="740"
        fill="#030509"/>

  <rect width="1200" height="740"
        fill="url(#background)"/>

  <rect width="1200" height="740"
        fill="url(#stars)">

    <animate attributeName="opacity"
      values=".4;.9;.4"
      dur="8s"
      repeatCount="indefinite"/>

  </rect>

  <!-- EDITORIAL SECTION HEADING -->

  <text x="45" y="48"
        font-family="Arial"
        font-size="13"
        letter-spacing="5"
        fill="#94A3B8">
    01 / INTELLIGENCE CORE
  </text>

  <text x="45" y="115"
        font-family="Arial"
        font-size="49"
        font-weight="bold"
        fill="url(#metal)">
    Intelligence in motion.
  </text>

  <text x="45" y="151"
        font-family="Arial"
        font-size="18"
        fill="#94A3B8">
    Exploring the intersection of Python, AI and software engineering.
  </text>

  <!-- AMBIENT LIGHT -->

  <ellipse cx="600" cy="425"
           rx="430" ry="280"
           fill="url(#halo)">

    <animate attributeName="opacity"
      values=".5;1;.5"
      dur="7s"
      repeatCount="indefinite"/>

  </ellipse>

  <!-- NEURAL CONNECTIONS -->

  <g stroke="#60A5FA"
     stroke-width="1"
     stroke-dasharray="4 10"
     opacity=".3">

    <path d="M165 270L600 425"/>
    <path d="M1035 270L600 425"/>
    <path d="M150 425L600 425"/>
    <path d="M1050 425L600 425"/>
    <path d="M220 580L600 425"/>
    <path d="M980 580L600 425"/>

    <animate attributeName="stroke-dashoffset"
      from="0" to="-70"
      dur="5s"
      repeatCount="indefinite"/>

  </g>

  <!-- ORBITAL SYSTEM -->

  <g transform="translate(600 425)">

    <g fill="none" stroke="url(#ring)">

      <ellipse rx="405" ry="120"
               transform="rotate(-15)"
               stroke-width="1.5"/>

      <ellipse rx="365" ry="145"
               transform="rotate(17)"
               stroke-width="1.2"/>

      <ellipse rx="300" ry="195"
               stroke-dasharray="3 12"
               opacity=".5">

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0" to="360"
          dur="65s"
          repeatCount="indefinite"/>

      </ellipse>

    </g>

    <!-- MOVING ORBITAL PARTICLES -->

    <g transform="rotate(-15)">

      <circle r="5" fill="#67E8F9"
              filter="url(#glow)">

        <animateMotion
          path="M405 0 A405 120 0 1 1 -405 0 A405 120 0 1 1 405 0"
          dur="12s"
          repeatCount="indefinite"/>

      </circle>

      <circle r="3" fill="#FFFFFF"
              filter="url(#glow)">

        <animateMotion
          path="M-405 0 A405 120 0 1 1 405 0 A405 120 0 1 1 -405 0"
          dur="12s"
          repeatCount="indefinite"/>

      </circle>

    </g>

    <g transform="rotate(17)">

      <circle r="4" fill="#C4B5FD"
              filter="url(#glow)">

        <animateMotion
          path="M365 0 A365 145 0 1 1 -365 0 A365 145 0 1 1 365 0"
          dur="16s"
          repeatCount="indefinite"/>

      </circle>

    </g>

    <!-- FLOATING AI SPHERE -->

    <g>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -12;0 0"
        dur="6s"
        repeatCount="indefinite"/>

      <circle r="180"
              fill="#2563EB"
              opacity=".2"
              filter="url(#blur)"/>

      <circle r="155"
              fill="url(#sphere)"
              stroke="#60A5FA"
              stroke-width="1"/>

      <!-- ROTATING SPHERICAL MESH -->

      <g clip-path="url(#sphereClip)"
         fill="none"
         stroke="#93C5FD"
         opacity=".19">

        <ellipse rx="155" ry="20"/>
        <ellipse rx="155" ry="45"/>
        <ellipse rx="155" ry="70"/>
        <ellipse rx="155" ry="95"/>
        <ellipse rx="155" ry="120"/>
        <ellipse rx="155" ry="145"/>

        <ellipse rx="25" ry="155"/>
        <ellipse rx="55" ry="155"/>
        <ellipse rx="85" ry="155"/>
        <ellipse rx="115" ry="155"/>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0" to="360"
          dur="45s"
          repeatCount="indefinite"/>

      </g>

      <!-- NEURAL NETWORK INSIDE CORE -->

      <g clip-path="url(#sphereClip)"
         stroke="#67E8F9"
         stroke-width=".8"
         opacity=".35">

        <path d="M-120 -40L-65 -95L0 -65L90 -105L120 -20L70 70L-20 115L-110 60Z"
              fill="none"/>

        <path d="M-120 -40L70 70L0 -65L-110 60L90 -105"
              fill="none"/>

        <g fill="#BFDBFE" filter="url(#glow)">
          <circle cx="-120" cy="-40" r="3"/>
          <circle cx="-65" cy="-95" r="3"/>
          <circle cx="0" cy="-65" r="3"/>
          <circle cx="90" cy="-105" r="3"/>
          <circle cx="120" cy="-20" r="3"/>
          <circle cx="70" cy="70" r="3"/>
          <circle cx="-20" cy="115" r="3"/>
          <circle cx="-110" cy="60" r="3"/>
        </g>

        <animateTransform
          attributeName="transform"
          type="rotate"
          from="360" to="0"
          dur="35s"
          repeatCount="indefinite"/>

      </g>

      <!-- PYTHON INSPIRED EMBLEM -->

      <g transform="translate(0 -12) scale(1.5)">

        <path d="M-38 -42H9
                 Q34 -42 34 -19
                 V0H-12V12H-47V-19
                 Q-47 -42 -25 -42Z"
              fill="#3776AB"
              stroke="#93C5FD"
              stroke-width=".6"/>

        <path d="M38 42H-9
                 Q-34 42 -34 19
                 V0H12V-12H47V19
                 Q47 42 25 42Z"
              fill="#FFD343"/>

        <circle cx="-23" cy="-28"
                r="4" fill="#FFFFFF"/>

        <circle cx="23" cy="28"
                r="4" fill="#FFFFFF"/>

      </g>

      <text y="112"
            text-anchor="middle"
            font-family="Arial"
            font-size="21"
            font-weight="bold"
            letter-spacing="7"
            fill="#FFFFFF">
        PYTHON
      </text>

    </g>

  </g>

  <!-- FLOATING TECHNOLOGY DOMAINS -->

  <g font-family="Arial"
     font-size="17"
     font-weight="bold"
     text-anchor="middle">

    <g transform="translate(165 270)">

      <circle cy="-23" r="6"
              fill="#60A5FA"
              filter="url(#glow)"/>

      <text fill="#93C5FD">
        MACHINE LEARNING
      </text>

      <text y="23" font-size="11"
            font-weight="normal"
            fill="#94A3B8">
        Predictive Intelligence
      </text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="165 270;165 260;165 270"
        dur="6s"
        repeatCount="indefinite"/>

    </g>

    <g transform="translate(1035 270)">

      <circle cy="-23" r="6"
              fill="#A78BFA"
              filter="url(#glow)"/>

      <text fill="#C4B5FD">
        GENERATIVE AI
      </text>

      <text y="23" font-size="11"
            font-weight="normal"
            fill="#94A3B8">
        Intelligent Generation
      </text>

      <animateTransform
        attributeName="transform"
        type="translate"
        values="1035 270;1035 258;1035 270"
        dur="7s"
        repeatCount="indefinite"/>

    </g>

    <g transform="translate(150 425)">

      <circle cy="-23" r="6"
              fill="#818CF8"
              filter="url(#glow)"/>

      <text fill="#A5B4FC">
        DEEP LEARNING
      </text>

      <text y="23" font-size="11"
            font-weight="normal"
            fill="#94A3B8">
        Neural Architectures
      </text>

    </g>

    <g transform="translate(1050 425)">

      <circle cy="-23" r="6"
              fill="#67E8F9"
              filter="url(#glow)"/>

      <text fill="#67E8F9">
        LARGE LANGUAGE MODELS
      </text>

      <text y="23" font-size="11"
            font-weight="normal"
            fill="#94A3B8">
        Language Intelligence
      </text>

    </g>

    <g transform="translate(220 580)">

      <circle cy="-23" r="6"
              fill="#60A5FA"
              filter="url(#glow)"/>

      <text fill="#93C5FD">
        DATA SCIENCE
      </text>

      <text y="23" font-size="11"
            font-weight="normal"
            fill="#94A3B8">
        Data Driven Insights
      </text>

    </g>

    <g transform="translate(980 580)">

      <circle cy="-23" r="6"
              fill="#C4B5FD"
              filter="url(#glow)"/>

      <text fill="#C4B5FD">
        AI AGENTS &amp; RAG
      </text>

      <text y="23" font-size="11"
            font-weight="normal"
            fill="#94A3B8">
        Intelligent Applications
      </text>

    </g>

  </g>

  <!-- FLOWING NEURAL ENERGY -->

  <g filter="url(#glow)">

    <circle r="3" fill="#67E8F9">

      <animateMotion
        path="M165 270L600 425L980 580"
        dur="6s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="3" fill="#C4B5FD">

      <animateMotion
        path="M1035 270L600 425L220 580"
        dur="7s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="3" fill="#FFFFFF">

      <animateMotion
        path="M150 425L1050 425"
        dur="8s"
        repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- BOTTOM TRANSITION -->

  <path d="M150 655H1050"
        stroke="url(#ring)"
        opacity=".5"/>

  <text x="600" y="700"
        text-anchor="middle"
        font-family="Arial"
        font-size="13"
        letter-spacing="6"
        fill="#94A3B8">
    DATA &#8594; INTELLIGENCE &#8594; IMPACT
  </text>

</svg>
