
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="570"
     viewBox="0 0 1200 570">

  <title>RAHUL OS 2.0 - Cinematic Signature</title>

  <defs>

    <!-- UNIFIED OBSIDIAN BACKGROUND -->

    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#172440"/>
      <stop offset="45%" stop-color="#080F1C"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <!-- ANIMATED METALLIC SIGNATURE -->

    <linearGradient id="metal"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">

      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="80%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>

      <animate attributeName="x1"
        values="0%;60%;0%"
        dur="8s"
        repeatCount="indefinite"/>

      <animate attributeName="x2"
        values="100%;40%;100%"
        dur="8s"
        repeatCount="indefinite"/>

    </linearGradient>

    <!-- CINEMATIC ENERGY GRADIENT -->

    <linearGradient id="energy">

      <stop offset="0%"
            stop-color="#2563EB"
            stop-opacity="0"/>

      <stop offset="25%"
            stop-color="#2563EB"/>

      <stop offset="50%"
            stop-color="#67E8F9"/>

      <stop offset="75%"
            stop-color="#8B5CF6"/>

      <stop offset="100%"
            stop-color="#8B5CF6"
            stop-opacity="0"/>

    </linearGradient>

    <linearGradient id="brand">

      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#C4B5FD"/>

    </linearGradient>

    <radialGradient id="blueHalo">

      <stop offset="0%"
            stop-color="#2563EB"
            stop-opacity=".35"/>

      <stop offset="100%"
            stop-color="#2563EB"
            stop-opacity="0"/>

    </radialGradient>

    <radialGradient id="purpleHalo">

      <stop offset="0%"
            stop-color="#8B5CF6"
            stop-opacity=".25"/>

      <stop offset="100%"
            stop-color="#8B5CF6"
            stop-opacity="0"/>

    </radialGradient>

    <linearGradient id="fade"
                    x1="0" y1="0"
                    x2="0" y2="1">

      <stop offset="0%"
            stop-color="#030509"
            stop-opacity="0"/>

      <stop offset="100%"
            stop-color="#030509"/>

    </linearGradient>

    <filter id="glow">

      <feGaussianBlur stdDeviation="3"
                      result="b"/>

      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>

    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="signatureShadow">

      <feDropShadow
        dx="0" dy="6"
        stdDeviation="10"
        flood-color="#2563EB"
        flood-opacity=".25"/>

    </filter>

    <pattern id="stars"
             width="190" height="170"
             patternUnits="userSpaceOnUse">

      <circle cx="17" cy="26" r=".8"
              fill="#FFFFFF" opacity=".3"/>

      <circle cx="87" cy="73" r=".7"
              fill="#93C5FD" opacity=".4"/>

      <circle cx="156" cy="138" r="1"
              fill="#C4B5FD" opacity=".4"/>

    </pattern>

  </defs>

  <!-- ================================= -->
  <!-- CONTINUOUS CINEMATIC BACKGROUND   -->
  <!-- ================================= -->

  <rect width="1200" height="570"
        fill="#030509"/>

  <rect width="1200" height="570"
        fill="url(#bg)"/>

  <rect width="1200" height="570"
        fill="url(#stars)">

    <animate attributeName="opacity"
      values=".4;1;.4"
      dur="9s"
      repeatCount="indefinite"/>

  </rect>

  <!-- MOVING AMBIENT LIGHT -->

  <ellipse cx="350" cy="280"
           rx="360" ry="230"
           fill="url(#blueHalo)">

    <animate attributeName="cx"
      values="350;850;350"
      dur="18s"
      repeatCount="indefinite"/>

  </ellipse>

  <ellipse cx="850" cy="290"
           rx="350" ry="230"
           fill="url(#purpleHalo)">

    <animate attributeName="cx"
      values="850;350;850"
      dur="20s"
      repeatCount="indefinite"/>

  </ellipse>

  <!-- ================================= -->
  <!-- ANIMATED CINEMATIC AURORA WAVES   -->
  <!-- ================================= -->

  <g fill="none"
     stroke="url(#energy)">

    <path d="M-100 360
             C250 80 850 650 1300 200"
          stroke-width="2"
          opacity=".35">

      <animate attributeName="d"
        values="
        M-100 360 C250 80 850 650 1300 200;
        M-100 250 C250 600 850 80 1300 350;
        M-100 360 C250 80 850 650 1300 200"
        dur="18s"
        repeatCount="indefinite"/>

    </path>

    <path d="M-100 385
             C250 105 850 675 1300 225"
          stroke-width="1.5"
          opacity=".25">

      <animate attributeName="d"
        values="
        M-100 385 C250 105 850 675 1300 225;
        M-100 275 C250 625 850 105 1300 375;
        M-100 385 C250 105 850 675 1300 225"
        dur="20s"
        repeatCount="indefinite"/>

    </path>

    <path d="M-100 410
             C250 130 850 700 1300 250"
          opacity=".18"/>

    <path d="M-100 435
             C250 155 850 725 1300 275"
          opacity=".15"/>

    <path d="M-100 460
             C250 180 850 750 1300 300"
          opacity=".12"/>

    <path d="M-100 485
             C250 205 850 775 1300 325"
          opacity=".08"/>

  </g>

  <!-- SOFT AURORA REFLECTION -->

  <path d="M-100 390
           C250 110 850 680 1300 230"
        fill="none"
        stroke="url(#energy)"
        stroke-width="35"
        opacity=".09"
        filter="url(#blur)"/>

  <!-- ================================= -->
  <!-- FLOATING LIGHT PARTICLES          -->
  <!-- ================================= -->

  <g filter="url(#glow)">

    <circle r="3.5" fill="#67E8F9">

      <animateMotion
        path="M-30 360C250 80 850 650 1230 200"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="3" fill="#C4B5FD">

      <animateMotion
        path="M1230 400Q600 50 -30 300"
        dur="15s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="2" fill="#FFFFFF">

      <animateMotion
        path="M100 500Q600 100 1100 500"
        dur="18s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="2.5" fill="#60A5FA">

      <animateMotion
        path="M1100 100Q600 500 100 100"
        dur="14s"
        repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- ================================= -->
  <!-- EDITORIAL CLOSING QUOTE           -->
  <!-- ================================= -->

  <g font-family="Arial, sans-serif"
     text-anchor="middle">

    <text x="600" y="48"
          font-size="13"
          letter-spacing="6"
          fill="#94A3B8">
      08 / THE SIGNATURE
    </text>

    <text x="600" y="125"
          font-size="33"
          font-weight="bold"
          fill="#F1F5F9">
      The future is built, not predicted.
    </text>

    <text x="600" y="165"
          font-size="18"
          fill="#94A3B8">
      One idea. One line of code. One step forward.
    </text>

  </g>

  <!-- ================================= -->
  <!-- PREMIUM METALLIC SIGNATURE        -->
  <!-- ================================= -->

  <text x="600" y="300"
        text-anchor="middle"
        font-family="Georgia, Times New Roman, serif"
        font-size="85"
        font-style="italic"
        letter-spacing="-3"
        fill="url(#metal)"
        filter="url(#signatureShadow)">
    Rahul Bhadekar
  </text>

  <!-- SIGNATURE UNDERLINE -->

  <path d="M285 325
           Q600 375 915 315"
        fill="none"
        stroke="url(#energy)"
        stroke-width="2.5"
        stroke-linecap="round"/>

  <!-- MOVING SIGNATURE HIGHLIGHT -->

  <path d="M285 325
           Q600 375 915 315"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2"
        stroke-dasharray="75 800"
        stroke-linecap="round"
        filter="url(#glow)">

    <animate attributeName="stroke-dashoffset"
      values="875;0;-875"
      dur="7s"
      repeatCount="indefinite"/>

  </path>

  <!-- PROFESSIONAL IDENTITY -->

  <text x="600" y="382"
        text-anchor="middle"
        font-family="Arial"
        font-size="15"
        font-weight="bold"
        letter-spacing="5"
        fill="#93C5FD">
    AI ENGINEER • FULL STACK DEVELOPER
  </text>

  <!-- ================================= -->
  <!-- PREMIUM BRAND SEPARATOR           -->
  <!-- ================================= -->

  <path d="M180 420H1020"
        stroke="url(#energy)"
        stroke-width="1"
        opacity=".65"/>

  <circle cx="600" cy="420"
          r="4"
          fill="#67E8F9"
          filter="url(#glow)">

    <animate attributeName="opacity"
      values=".3;1;.3"
      dur="4s"
      repeatCount="indefinite"/>

  </circle>

  <!-- ================================= -->
  <!-- RAHULTECHNOTES BRANDING           -->
  <!-- ================================= -->

  <g text-anchor="middle"
     font-family="Arial, sans-serif">

    <text x="600" y="475"
          font-size="30"
          font-weight="900"
          letter-spacing="-1"
          fill="url(#brand)">
      RahulTechNotes
    </text>

    <text x="600" y="505"
          font-size="12"
          letter-spacing="7"
          fill="#67E8F9">
      LEARN • CODE • GROW
    </text>

  </g>

  <!-- BOTTOM FADE -->

  <rect x="0" y="520"
        width="1200" height="50"
        fill="url(#fade)"/>

  <!-- FINAL SYSTEM IDENTITY -->

  <text x="600" y="550"
        text-anchor="middle"
        font-family="Arial"
        font-size="10"
        letter-spacing="4"
        fill="#64748B">
    RAHUL OS 2.0 — AI ENGINEER EDITION
  </text>

</svg>
