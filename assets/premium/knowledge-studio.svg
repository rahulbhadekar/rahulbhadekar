
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="700"
     viewBox="0 0 1200 700">

  <title>RahulTechNotes - Premium Knowledge Studio</title>

  <defs>

    <!-- UNIFIED OBSIDIAN THEME -->

    <radialGradient id="bg" cx="70%" cy="45%" r="85%">
      <stop offset="0%" stop-color="#18243F"/>
      <stop offset="50%" stop-color="#080F1C"/>
      <stop offset="100%" stop-color="#030509"/>
    </radialGradient>

    <linearGradient id="metal" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#E2E8F0"/>
      <stop offset="60%" stop-color="#94A3B8"/>
      <stop offset="85%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="cover" x2="1" y2="1">
      <stop offset="0%" stop-color="#263A57"/>
      <stop offset="45%" stop-color="#142039"/>
      <stop offset="100%" stop-color="#080E18"/>
    </linearGradient>

    <linearGradient id="pages" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <linearGradient id="reflection">
      <stop offset="0%" stop-color="#FFFFFF"
            stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF"
            stop-opacity=".17"/>
      <stop offset="100%" stop-color="#FFFFFF"
            stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="energy">
      <stop offset="0%" stop-color="#2563EB"
            stop-opacity="0"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#8B5CF6"
            stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="halo">
      <stop offset="0%" stop-color="#6366F1"
            stop-opacity=".35"/>
      <stop offset="100%" stop-color="#6366F1"
            stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blur">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="0" dy="15"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity=".75"/>
    </filter>

    <pattern id="stars"
             width="190" height="170"
             patternUnits="userSpaceOnUse">

      <circle cx="17" cy="26" r=".8"
              fill="#FFFFFF" opacity=".3"/>

      <circle cx="87" cy="73" r=".7"
              fill="#93C5FD" opacity=".4"/>

      <circle cx="156" cy="138" r="1"
              fill="#C4B5FD" opacity=".4"/>

    </pattern>

    <clipPath id="bookClip">
      <rect x="-66" y="-110"
            width="132" height="215"
            rx="6"/>
    </clipPath>

    <!-- REUSABLE PREMIUM BOOK -->

    <g id="book">

      <!-- BOOK SHADOW -->

      <rect x="-57" y="-100"
            width="140" height="225"
            rx="6"
            fill="#000000"
            opacity=".6"
            filter="url(#shadow)"/>

      <!-- BACK COVER -->

      <rect x="-57" y="-102"
            width="140" height="225"
            rx="6"
            fill="currentColor"
            opacity=".55"/>

      <!-- PAPER BLOCK -->

      <rect x="-57" y="-100"
            width="134" height="217"
            rx="3"
            fill="url(#pages)"/>

      <!-- PAGE DETAILS -->

      <g stroke="#64748B"
         stroke-width=".7"
         opacity=".65">

        <path d="M-53 106H75"/>
        <path d="M-53 109H75"/>
        <path d="M-53 112H75"/>
        <path d="M-53 115H75"/>

        <path d="M69 -96V104"/>
        <path d="M72 -96V104"/>
        <path d="M75 -96V104"/>

      </g>

      <!-- FRONT COVER -->

      <rect x="-66" y="-110"
            width="132" height="215"
            rx="6"
            fill="url(#cover)"
            stroke="currentColor"
            stroke-width="1.2"/>

      <!-- COLORED BOOK SPINE -->

      <rect x="-66" y="-110"
            width="12" height="215"
            rx="3"
            fill="currentColor"
            opacity=".8"/>

      <path d="M-51 -100V95"
            stroke="#FFFFFF"
            stroke-opacity=".12"/>

      <!-- COVER DECORATION -->

      <path d="M-40 -83H45"
            stroke="currentColor"
            stroke-width="1.5"/>

      <path d="M-40 69H45"
            stroke="currentColor"
            stroke-opacity=".5"/>

      <rect x="-42" y="-70"
            width="92" height="130"
            rx="4"
            fill="none"
            stroke="currentColor"
            stroke-opacity=".13"/>

      <!-- ANIMATED COVER REFLECTION -->

      <g clip-path="url(#bookClip)">

        <rect x="-230" y="-120"
              width="65" height="250"
              fill="url(#reflection)"
              transform="skewX(-20)">

          <animate attributeName="x"
            values="-230;230;230"
            keyTimes="0;.65;1"
            dur="8s"
            repeatCount="indefinite"/>

        </rect>

      </g>

      <text x="4" y="89"
            text-anchor="middle"
            font-family="Arial"
            font-size="7"
            letter-spacing="1"
            fill="#CBD5E1">
        RAHULTECHNOTES
      </text>

    </g>

  </defs>

  <!-- CONTINUOUS BACKGROUND -->

  <rect width="1200" height="700"
        fill="#030509"/>

  <rect width="1200" height="700"
        fill="url(#bg)"/>

  <rect width="1200" height="700"
        fill="url(#stars)">

    <animate attributeName="opacity"
      values=".4;.9;.4"
      dur="9s"
      repeatCount="indefinite"/>

  </rect>

  <!-- AMBIENT LIGHT -->

  <ellipse cx="850" cy="350"
           rx="370" ry="300"
           fill="url(#halo)">

    <animate attributeName="opacity"
      values=".5;1;.5"
      dur="8s"
      repeatCount="indefinite"/>

  </ellipse>

  <!-- FLOWING ENERGY RIBBONS -->

  <g fill="none"
     stroke="url(#energy)">

    <path d="M-100 470
             C300 160 850 700 1300 250"
          opacity=".2">

      <animate attributeName="d"
        values="
        M-100 470 C300 160 850 700 1300 250;
        M-100 350 C300 650 850 160 1300 400;
        M-100 470 C300 160 850 700 1300 250"
        dur="18s"
        repeatCount="indefinite"/>

    </path>

    <path d="M-100 500
             C300 190 850 730 1300 280"
          opacity=".12"/>

  </g>

  <!-- EDITORIAL BRAND INTRODUCTION -->

  <g font-family="Arial, sans-serif">

    <text x="45" y="48"
          font-size="13"
          letter-spacing="5"
          fill="#94A3B8">
      07 / KNOWLEDGE STUDIO
    </text>

    <text x="45" y="155"
          font-size="61"
          font-weight="900"
          letter-spacing="-2"
          fill="url(#metal)">
      RahulTechNotes
    </text>

    <text x="48" y="202"
          font-size="17"
          font-weight="bold"
          letter-spacing="8"
          fill="#67E8F9">
      LEARN • CODE • GROW
    </text>

    <text x="45" y="290"
          font-size="29"
          font-weight="bold"
          fill="#F1F5F9">
      Knowledge worth sharing.
    </text>

    <g font-size="18"
       fill="#94A3B8">

      <text x="45" y="335">
        Simplifying complex programming concepts
      </text>

      <text x="45" y="365">
        through structured notes, practical examples
      </text>

      <text x="45" y="395">
        and interview-focused learning resources.
      </text>

    </g>

    <path d="M45 440H480"
          stroke="#334155"/>

    <text x="45" y="478"
          font-size="13"
          letter-spacing="3"
          fill="#A5B4FC">
      THE KNOWLEDGE COLLECTION
    </text>

    <text x="45" y="515"
          font-size="18"
          fill="#CBD5E1">
      #RahulTechNotes
    </text>

  </g>

  <!-- BOOK COLLECTION SHADOW -->

  <ellipse cx="870" cy="475"
           rx="280" ry="45"
           fill="#2563EB"
           opacity=".2"
           filter="url(#blur)">

    <animate attributeName="rx"
      values="280;250;280"
      dur="8s"
      repeatCount="indefinite"/>

  </ellipse>

  <!-- ================================= -->
  <!-- BOOK 01 : PYTHON                  -->
  <!-- ================================= -->

  <g transform="translate(655 350) rotate(-17)">

    <g color="#FACC15">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -15;0 0"
        dur="6s"
        repeatCount="indefinite"/>

      <use xlink:href="#book"/>

      <text x="4" y="-43"
            text-anchor="middle"
            font-family="Arial"
            font-size="21"
            font-weight="900"
            fill="#FACC15">
        PYTHON
      </text>

      <text x="4" y="-22"
            text-anchor="middle"
            font-family="Arial"
            font-size="10"
            fill="#CBD5E1">
        Programming
      </text>

      <!-- PYTHON-INSPIRED SYMBOL -->

      <g transform="translate(3 20) scale(.65)">

        <path d="M-38 -42H9
                 Q34 -42 34 -19
                 V0H-12V12H-47V-19
                 Q-47 -42 -25 -42Z"
              fill="#3776AB"/>

        <path d="M38 42H-9
                 Q-34 42 -34 19
                 V0H12V-12H47V19
                 Q47 42 25 42Z"
              fill="#FFD343"/>

        <circle cx="-23" cy="-28"
                r="4" fill="#FFFFFF"/>

        <circle cx="23" cy="28"
                r="4" fill="#FFFFFF"/>

      </g>

    </g>

  </g>

  <!-- ================================= -->
  <!-- BOOK 02 : JAVA                    -->
  <!-- ================================= -->

  <g transform="translate(790 315) rotate(-5)">

    <g color="#FB923C">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -10;0 8;0 -10"
        dur="7s"
        repeatCount="indefinite"/>

      <use xlink:href="#book"/>

      <text x="4" y="-43"
            text-anchor="middle"
            font-family="Arial"
            font-size="25"
            font-weight="900"
            fill="#FB923C">
        JAVA
      </text>

      <text x="4" y="-22"
            text-anchor="middle"
            font-family="Arial"
            font-size="10"
            fill="#CBD5E1">
        Core Concepts
      </text>

      <!-- JAVA-INSPIRED COFFEE SYMBOL -->

      <g transform="translate(3 25)"
         fill="none"
         stroke="#FB923C"
         stroke-width="2.5"
         stroke-linecap="round">

        <path d="M-25 0H20
                 Q20 30 -3 30
                 Q-25 30 -25 0Z"/>

        <path d="M20 5Q43 2 33 19L17 22"/>

        <path d="M-35 36Q0 45 35 36"/>

        <path d="M-7 -7
                 C-28 -24 17 -25 0 -43"/>

        <path d="M8 -8
                 C-8 -20 25 -23 13 -34"/>

      </g>

    </g>

  </g>

  <!-- ================================= -->
  <!-- BOOK 03 : SQL                     -->
  <!-- ================================= -->

  <g transform="translate(925 330) rotate(10)">

    <g color="#60A5FA">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 0;0 -18;0 0"
        dur="8s"
        repeatCount="indefinite"/>

      <use xlink:href="#book"/>

      <text x="4" y="-43"
            text-anchor="middle"
            font-family="Arial"
            font-size="26"
            font-weight="900"
            fill="#93C5FD">
        SQL
      </text>

      <text x="4" y="-22"
            text-anchor="middle"
            font-family="Arial"
            font-size="10"
            fill="#CBD5E1">
        Database Systems
      </text>

      <!-- DATABASE SYMBOL -->

      <g transform="translate(4 20)"
         fill="#172554"
         stroke="#60A5FA"
         stroke-width="2">

        <path d="M-28 -20V25
                 Q0 48 28 25V-20Z"/>

        <ellipse cy="-20"
                 rx="28" ry="11"
                 fill="#2563EB"/>

        <path d="M-28 -5Q0 17 28 -5"
              fill="none"/>

        <path d="M-28 10Q0 32 28 10"
              fill="none"/>

      </g>

    </g>

  </g>

  <!-- ================================= -->
  <!-- BOOK 04 : ARTIFICIAL INTELLIGENCE -->
  <!-- ================================= -->

  <g transform="translate(1060 370) rotate(17)">

    <g color="#A78BFA">

      <animateTransform
        attributeName="transform"
        type="translate"
        values="0 -7;0 10;0 -7"
        dur="6s"
        repeatCount="indefinite"/>

      <use xlink:href="#book"/>

      <text x="4" y="-43"
            text-anchor="middle"
            font-family="Arial"
            font-size="30"
            font-weight="900"
            fill="#C4B5FD">
        AI
      </text>

      <text x="4" y="-22"
            text-anchor="middle"
            font-family="Arial"
            font-size="9"
            fill="#CBD5E1">
        Artificial Intelligence
      </text>

      <!-- NEURAL NETWORK SYMBOL -->

      <g transform="translate(4 20)"
         stroke="#A78BFA"
         stroke-width="1.5">

        <g opacity=".7">

          <path d="M-27 -25L0 -10L27 -25"/>
          <path d="M-27 -25L0 25L27 -25"/>
          <path d="M-27 25L0 -10L27 25"/>
          <path d="M-27 25L0 25L27 25"/>

        </g>

        <g fill="#172554">

          <circle cx="-27" cy="-25" r="6"/>
          <circle cx="-27" cy="25" r="6"/>
          <circle cx="0" cy="-10" r="7"/>
          <circle cx="0" cy="25" r="7"/>
          <circle cx="27" cy="-25" r="6"/>
          <circle cx="27" cy="25" r="6"/>

        </g>

        <circle cx="0" cy="-10"
                r="3"
                fill="#C4B5FD"
                filter="url(#glow)">

          <animate attributeName="opacity"
            values=".3;1;.3"
            dur="3s"
            repeatCount="indefinite"/>

        </circle>

      </g>

    </g>

  </g>

  <!-- FLOATING ENERGY PARTICLES -->

  <g filter="url(#glow)">

    <circle r="3" fill="#67E8F9">

      <animateMotion
        path="M580 200Q850 50 1150 230"
        dur="10s"
        repeatCount="indefinite"/>

    </circle>

    <circle r="3" fill="#C4B5FD">

      <animateMotion
        path="M1150 520Q850 620 580 450"
        dur="12s"
        repeatCount="indefinite"/>

    </circle>

  </g>

  <!-- KNOWLEDGE COLLECTION STRIP -->

  <path d="M45 555H1155"
        stroke="url(#energy)"
        opacity=".6"/>

  <g font-family="Arial"
     text-anchor="middle">

    <g transform="translate(170 595)">

      <circle cy="-8"
              r="4"
              fill="#67E8F9"
              filter="url(#glow)"/>

      <text y="20"
            font-size="15"
            font-weight="bold"
            fill="#CBD5E1">
        Programming Notes
      </text>

    </g>

    <g transform="translate(455 595)">

      <circle cy="-8"
              r="4"
              fill="#60A5FA"
              filter="url(#glow)"/>

      <text y="20"
            font-size="15"
            font-weight="bold"
            fill="#CBD5E1">
        Interview Preparation
      </text>

    </g>

    <g transform="translate(745 595)">

      <circle cy="-8"
              r="4"
              fill="#A78BFA"
              filter="url(#glow)"/>

      <text y="20"
            font-size="15"
            font-weight="bold"
            fill="#CBD5E1">
        Developer Resources
      </text>

    </g>

    <g transform="translate(1030 595)">

      <circle cy="-8"
              r="4"
              fill="#67E8F9"
              filter="url(#glow)"/>

      <text y="20"
            font-size="15"
            font-weight="bold"
            fill="#CBD5E1">
        AI Concepts
      </text>

    </g>

  </g>

  <!-- SIGNATURE -->

  <path d="M45 645H1155"
        stroke="#334155"
        opacity=".6"/>

  <text x="600" y="677"
        text-anchor="middle"
        font-family="Arial"
        font-size="12"
        letter-spacing="4"
        fill="#94A3B8">
    CREATED BY RAHUL BHADEKAR
  </text>

  <circle r="2.5"
          fill="#67E8F9"
          filter="url(#glow)">

    <animateMotion
      path="M45 645H1155"
      dur="9s"
      repeatCount="indefinite"/>

  </circle>

</svg>
