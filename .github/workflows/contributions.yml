
name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/contributions.yml"

permissions:
  contents: write

concurrency:
  group: contribution-animations
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: rahulbhadekar
          outputs: |
            dist/github-snake.svg?color_snake=#6366f1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22d3ee

      - name: Generate Pac-Man Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: rahulbhadekar

      - name: Publish Contribution Animations
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
