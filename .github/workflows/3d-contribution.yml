
name: Generate 3D Contribution Skyline

on:
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/3d-contribution.yml"

permissions:
  contents: write

concurrency:
  group: contribution-skyline
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rahulbhadekar

      - name: Commit and Push Skyline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile-3d-contrib/

          if git diff --cached --quiet; then
            echo "No contribution changes detected."
          else
            git commit -m "Update 3D contribution skyline"
            git pull --rebase origin main
            git push origin main
          fi
